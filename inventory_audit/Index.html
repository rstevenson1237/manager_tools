<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <style>
    /* Same look as the P&L Tracker (pnl_tracker/Index.html). */
    :root{--brand:#1F5FAD;--brand-dark:#163F73;--brand-soft:#E8EFF8;--ink:#1A1D21;--muted:#5A6069;--line:#E2E2DC;
      --ground:#F6F6F3;--good:#1F5FAD;--bad:#9A4508;--bad-soft:#FFF4E8;--bad-line:#EBC9A3;--danger:#b3271b;}
    *{box-sizing:border-box;}
    [v-cloak]{display:none;}
    body{font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;margin:0;background:var(--ground);color:var(--ink);font-size:14px;}
    nav.top{background:#fff;border-bottom:1px solid var(--line);padding:10px 16px;display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;}
    nav.top .title{font-weight:700;font-size:16px;}
    nav.top .tabs{display:flex;flex-wrap:wrap;gap:4px;}
    nav.top .tab{background:none;border:none;padding:10px 14px;border-radius:8px;font-size:14px;color:#3D434B;cursor:pointer;min-height:40px;font-weight:400;}
    nav.top .tab:hover:not(:disabled){background:#F1F2EF;}
    nav.top .tab.active,nav.top .tab.active:hover:not(:disabled){background:var(--brand-soft);color:var(--brand-dark);font-weight:600;}
    nav.top .tab .count{font-size:12px;color:var(--muted);margin-left:6px;font-weight:400;}
    nav.top .who{margin-left:auto;font-size:12px;color:var(--muted);display:flex;gap:10px;align-items:center;}
    main{max-width:1200px;margin:0 auto;padding:20px 16px 60px;display:flex;flex-direction:column;gap:16px;}
    h1{margin:0;font-size:24px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;}
    h2{margin:0;font-size:16px;}
    h3{margin:0 0 6px;font-size:14px;}
    .row{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between;}
    .controls{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;}
    .field{display:flex;flex-direction:column;gap:4px;}
    .field label{font-size:12px;color:var(--muted);}
    select,input[type=text],input[type=email]{font:inherit;min-height:40px;padding:0 10px;border:1px solid #C9CCD1;border-radius:8px;background:#fff;color:var(--ink);}
    button{font:inherit;font-weight:600;background:var(--brand);color:#fff;border:none;padding:0 16px;min-height:40px;border-radius:8px;cursor:pointer;}
    button:hover:not(:disabled){background:var(--brand-dark);}
    button:disabled{background:#C9CCD1;cursor:not-allowed;}
    button.ghost{background:#fff;color:var(--ink);border:1px solid #C9CCD1;}
    button.ghost:hover:not(:disabled){background:#F1F2EF;}
    button.danger{background:var(--danger);}
    button.small{min-height:30px;padding:0 10px;font-size:12px;}
    button.link{background:none;color:var(--brand);padding:0;min-height:0;font-weight:600;}
    button.link:hover:not(:disabled){background:none;text-decoration:underline;}
    .card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;}
    .card.flush{padding:0;overflow:hidden;}
    .grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));}
    .stat .label{font-size:12px;color:var(--muted);font-weight:600;}
    .stat .value{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;}
    .stat .sub{font-size:12px;color:var(--muted);}
    .good{color:var(--good);} .bad{color:var(--bad);} .muted{color:var(--muted);font-size:12px;}
    .badge{display:inline-block;font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;letter-spacing:.02em;white-space:nowrap;}
    .badge.spike{background:#E8E9E6;color:#3D434B;} .badge.trend{background:var(--bad);color:#fff;}
    .badge.impact{background:var(--bad-soft);color:#6B3608;border:1px solid #C9772E;}
    .badge.st-correct{background:#E3F1DF;color:#2F6324;} .badge.st-review{background:#FFF3C9;color:#6B5000;} .badge.st-adjust{background:#B3401B;color:#fff;}
    .badge.st-other{background:#E8E9E6;color:#3D434B;}
    .banner{border-radius:10px;padding:12px 16px;font-size:13px;line-height:1.5;}
    .banner.warn{background:var(--bad-soft);border:1px solid var(--bad-line);color:#4A2A0A;}
    .banner.info{background:var(--brand-soft);border:1px solid #C9D8EE;color:var(--brand-dark);}
    table{border-collapse:collapse;width:100%;}
    th,td{padding:7px 10px;border-bottom:1px solid #EDEDE8;font-size:13px;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;}
    th{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:600;background:#FAFAF8;position:sticky;top:0;}
    td:first-child,th:first-child{text-align:left;}
    tr.sec td{background:var(--ground);font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:#4A5058;padding-top:10px;}
    .bar{position:relative;height:10px;background:#F3F4F1;border-radius:4px;min-width:120px;}
    .bar .fill{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:var(--brand);}
    .drop{border:2px dashed #B9C6D6;border-radius:12px;padding:22px;text-align:center;cursor:pointer;background:#fff;display:block;}
    .drop input{display:none;}
    .checks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;}
    .checks li{display:flex;gap:8px;align-items:flex-start;font-size:13px;}
    .toast-stack{position:fixed;top:16px;right:16px;z-index:60;display:flex;flex-direction:column;gap:8px;max-width:340px;}
    .toast{padding:10px 36px 10px 12px;border-radius:8px;font-weight:600;font-size:13px;box-shadow:0 2px 10px rgba(0,0,0,.18);position:relative;}
    .toast-close{position:absolute;top:4px;right:4px;background:none;color:inherit;min-height:0;padding:4px 8px;opacity:.6;}
    .toast-close:hover:not(:disabled){background:none;opacity:1;}
    .s-loading{background:var(--brand-soft);color:var(--brand);} .s-success{background:#d4edda;color:#155724;} .s-error{background:#f8d7da;color:#721c24;}
    .spin{display:inline-block;width:14px;height:14px;border:2px solid #cfe0ff;border-top-color:var(--brand);border-radius:50%;animation:s .8s linear infinite;vertical-align:middle;margin-right:6px;}
    @keyframes s{to{transform:rotate(360deg);}}
    .empty{padding:60px 20px;text-align:center;color:var(--muted);}
    .overlay{position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:50;display:flex;align-items:center;justify-content:center;}
    .modal{background:#fff;border-radius:12px;max-width:680px;width:94%;max-height:88vh;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:14px;}
    .modal section{border-top:1px solid var(--line);padding-top:12px;}
    .chip-list{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px;}
    .chip-list li{background:#F1F3F4;border-radius:12px;padding:4px 6px 4px 10px;font-size:12px;display:flex;align-items:center;gap:6px;}
    .chip-list li button{background:none;color:var(--danger);min-height:0;padding:0 4px;}
    .chip-list li button:hover:not(:disabled){background:none;}
    .pending-pill{font-size:12px;font-weight:700;color:var(--brand-dark);background:var(--brand-soft);padding:6px 10px;border-radius:999px;white-space:nowrap;}
    .check-label{display:flex;gap:6px;align-items:center;font-size:13px;min-height:40px;cursor:pointer;}
    .check-label input{width:18px;height:18px;}
    .inv-scroll{max-height:75vh;overflow:auto;overscroll-behavior:contain;}
    .inv-table{min-width:1000px;}
    .inv-table td{vertical-align:top;}
    .inv-table td.inv-item,.inv-table th.inv-item{white-space:normal;min-width:190px;max-width:240px;position:sticky;left:0;}
    .inv-table td.inv-item{z-index:1;background:#fff;box-shadow:inset -1px 0 0 #E2E2DC;}
    .inv-table th.inv-item{z-index:3;}
    .inv-table tr.sec td{position:sticky;top:30px;z-index:2;white-space:normal;}
    .inv-table tr.sec td .sec-label{position:sticky;left:10px;}
    .inv-table th{z-index:2;}
    .inv-table tr.st-row-correct td{background:#F0F7EE;} .inv-table tr.st-row-review td{background:#FFF9E6;} .inv-table tr.st-row-adjust td{background:#FFF1EC;}
    .zero-cost{color:var(--danger);font-weight:700;}
    .cat-btns{display:flex;gap:4px;margin-bottom:6px;}
    .cat-btn{flex:1;font-size:11px;min-height:30px;padding:0 4px;border-radius:6px;border:1px solid #C9CCD1;background:#fff;color:#3D434B;font-weight:700;letter-spacing:.02em;}
    .cat-btn:hover:not(:disabled){background:#F6F6F3;}
    .cat-btn.cat-correct{border-color:#3C7A2E;color:#2F6324;} .cat-btn.cat-review{border-color:#A67C00;color:#7A5B00;} .cat-btn.cat-adjust{border-color:#B3401B;color:#9A3412;}
    .cat-btn.active.cat-correct,.cat-btn.active.cat-correct:hover:not(:disabled){background:#3C7A2E;color:#fff;}
    .cat-btn.active.cat-review,.cat-btn.active.cat-review:hover:not(:disabled){background:#A67C00;color:#fff;}
    .cat-btn.active.cat-adjust,.cat-btn.active.cat-adjust:hover:not(:disabled){background:#B3401B;color:#fff;}
    .sync{font-size:12px;margin-top:3px;white-space:normal;}
    @media print{nav.top,.no-print,.toast-stack{display:none !important;} body{background:#fff;} main{padding:0;}
      .inv-scroll{max-height:none;overflow:visible;} .inv-table tr.sec td,.inv-table .inv-item{position:static;}}
  </style>
</head>
<body>
<div id="app" v-cloak>
  <div class="toast-stack">
    <div v-for="t in toasts" :key="t.id" :class="['toast', 's-' + t.type]">{{ t.msg }}
      <button class="toast-close" @click="dismissToast(t.id)" aria-label="Dismiss">×</button>
    </div>
  </div>

  <div v-if="bootLoading" class="empty"><span class="spin"></span>Loading…</div>
  <div v-else-if="!bootstrap.properties.length" class="empty">
    No properties are set up for your account.<br>Signed in as {{ bootstrap.email || 'an unknown account' }}. Ask an administrator to add you.
  </div>

  <template v-else>
    <nav class="top">
      <div class="title">Inventory Audit</div>
      <select v-if="bootstrap.properties.length > 1" aria-label="Property" :value="activeProperty && activeProperty.id" @change="onPropertyChange($event.target.value)">
        <option v-for="p in bootstrap.properties" :key="p.id" :value="p.id">{{ p.name }}</option>
      </select>
      <div class="tabs" role="tablist">
        <button v-for="t in tabs" :key="t.key" role="tab" :aria-selected="view === t.key" :class="['tab', { active: view === t.key }]" @click="go(t.key)">
          {{ t.label }}<span class="count" v-if="t.items">{{ t.counts.reviewed }}/{{ t.counts.total }}</span></button>
        <button v-if="session.isAdmin" role="tab" :aria-selected="view === 'upload'" :class="['tab', { active: view === 'upload' }]" @click="go('upload')">Upload</button>
      </div>
      <div class="who">
        <span>{{ session.email || bootstrap.email }}<template v-if="bootstrap.isGlobalAdmin"> · global admin</template><template v-else-if="session.isAdmin"> · admin</template></span>
        <button v-if="session.isAdmin" class="ghost small" @click="openSettings">Settings</button>
      </div>
    </nav>

    <main>
      <div v-if="loading && !tabs.length" class="muted"><span class="spin"></span>Loading…</div>
      <div v-else-if="loadError" class="banner warn">{{ loadError }}</div>

      <!-- ============================== REVIEW ============================== -->
      <template v-if="activeTab">
        <div v-if="!activeTab.items" class="card empty">
          No {{ activeTab.label.toLowerCase() }} count uploaded yet.
          <template v-if="session.isAdmin"><br><br>Export <b>Inventory Count Item Details</b> from R365 as CSV, then <button class="link" @click="go('upload')">upload it</button>.</template>
        </div>
        <template v-else>
          <div class="row">
            <div>
              <div class="muted">{{ activeTab.items }} items<template v-if="activeTab.upload"> · uploaded {{ dayLabel(activeTab.upload.at) }}<template v-if="activeTab.upload.by"> by {{ activeTab.upload.by }}</template><template v-if="activeTab.upload.file"> · {{ activeTab.upload.file }}</template></template></div>
              <h1>{{ activeProperty.name }} · {{ activeTab.label }} count</h1>
            </div>
            <div style="min-width:240px;flex:0 1 320px">
              <div class="muted" style="display:flex;justify-content:space-between"><span>Reviewed</span><b>{{ notedCount }} of {{ activeTab.counts.total }}</b></div>
              <div class="bar" style="margin-top:4px"><div class="fill" :style="{ width: pct(notedCount, activeTab.counts.total) + '%' }"></div></div>
              <div class="muted" style="margin-top:4px">{{ statusCounts.adjust }} adjust · {{ statusCounts.review }} review · {{ statusCounts.correct }} correct</div>
            </div>
          </div>

          <div class="grid">
            <div class="card stat"><div class="label">Inventory value</div><div class="value">{{ money(activeTab.totals.current) }}</div>
              <div class="sub">last count {{ money(activeTab.totals.previous) }} · <span :class="cls(activeTab.totals.change)">{{ signed(activeTab.totals.change) }}</span></div></div>
            <div class="card stat"><div class="label">Price changes</div><div class="value" :class="cls(activeTab.totals.priceEffect)">{{ signed(activeTab.totals.priceEffect) }}</div>
              <div class="sub">cost changes on what was counted</div></div>
            <div class="card stat"><div class="label">Quantity changes</div><div class="value" :class="cls(activeTab.totals.qtyEffect)">{{ signed(activeTab.totals.qtyEffect) }}</div>
              <div class="sub">everything else</div></div>
            <div class="card stat"><div class="label">High impact</div><div class="value" :class="{ bad: highImpactOpen }">{{ highImpactCount }}</div>
              <div class="sub">{{ money(highImpactCut) }}+ items, {{ highImpactOpen }} without a note</div></div>
          </div>

          <div class="row no-print">
            <div class="controls">
              <div class="field"><label for="mode">Show</label>
                <select id="mode" v-model="mode">
                  <option v-for="m in MODES" :key="m.key" :value="m.key">{{ m.label }}</option>
                </select></div>
              <div class="field"><label for="search">Find an item</label><input id="search" type="text" v-model="search" placeholder="Name contains…" style="width:180px"></div>
              <label class="check-label"><input type="checkbox" v-model="onlyOpen"> Only items without a note</label>
            </div>
            <div class="controls">
              <span class="pending-pill" v-if="pendingCount || syncing">{{ syncing ? 'Saving notes…' : pendingCount + ' note' + (pendingCount === 1 ? '' : 's') + ' not saved yet' }}</span>
              <button class="small" @click="syncPending(true)" :disabled="syncing || !pendingCount">Save now</button>
              <button class="ghost small" @click="loadData()" :disabled="loading">Refresh</button>
            </div>
          </div>
          <div class="muted" v-if="modeHint">{{ modeHint }}</div>

          <div class="card flush">
            <div class="inv-scroll">
              <table class="inv-table">
                <thead><tr><th class="inv-item">Item</th><th>Quantity</th><th>Cost</th><th>Value</th><th>Dollar impact</th><th style="text-align:left;min-width:220px">Why it is here</th><th style="text-align:left;min-width:220px;width:220px">Note</th></tr></thead>
                <tbody>
                  <template v-for="r in rows" :key="r.id">
                    <tr v-if="r.head" class="sec"><td colspan="7"><span class="sec-label">{{ r.head }}<span v-if="r.sub" class="muted" style="text-transform:none;letter-spacing:0;font-weight:400"> · {{ r.sub }}</span></span></td></tr>
                    <tr v-else :class="'st-row-' + statusOf(r.key)">
                      <td class="inv-item"><b>{{ r.it.item }}</b>
                        <div class="muted">{{ r.it.uom }}<template v-if="mode !== 'account'"> · {{ r.it.inventoryAcct }}</template><template v-if="/assumed/i.test(r.it.flag)"> · <span class="bad">{{ r.it.flag }}</span></template></div>
                        <span v-if="r.it.impact >= highImpactCut" class="badge impact" title="On the regional manager's check">High impact</span></td>
                      <td>{{ qty(r.it.prevQty) }} → <b>{{ qty(r.it.curQty) }}</b></td>
                      <td :class="{ bad: r.it.variance != null && Math.abs(r.it.variance) >= 0.1, 'zero-cost': r.it.curQty > 0 && !r.it.curCost }">{{ cost(r.it.prevCost) }} → <b>{{ cost(r.it.curCost) }}</b>
                        <div v-if="r.it.variance != null && Math.abs(r.it.variance) >= 0.005" class="muted">{{ signedPct(r.it.variance * 100) }}</div></td>
                      <td>{{ money(r.it.curTotal) }}<div class="muted">was {{ money(r.it.prevTotal) }}</div></td>
                      <td><b>{{ money(r.it.impact) }}</b>
                        <div class="muted" v-if="Math.round(r.it.priceEffect)">price {{ signed(r.it.priceEffect) }}</div>
                        <div class="muted" v-if="Math.round(r.it.qtyEffect)">qty {{ signed(r.it.qtyEffect) }}</div></td>
                      <td style="text-align:left;white-space:normal">
                        <div v-for="(why, i) in reasons(r)" :key="i" :class="{ muted: i > 0 }" style="margin-bottom:2px">{{ why }}</div></td>
                      <td style="text-align:left;white-space:normal">
                        <div class="cat-btns" role="group" :aria-label="'Note type for ' + r.it.item">
                          <button v-for="p in PREFIXES" :key="p.key" type="button" :class="['cat-btn', 'cat-' + p.key, { active: categoryOf(r.key) === p.prefix }]" @click="pickCategory(r.key, p.prefix)">{{ p.prefix }}</button>
                        </div>
                        <select :value="noteOf(r.key)" @change="applyEdit(r.key, $event.target.value)" :aria-label="'Note for ' + r.it.item" style="width:100%;min-height:32px;font-size:12px">
                          <option value="">{{ categoryOf(r.key) ? 'Choose a note…' : 'No note' }}</option>
                          <option v-for="o in optionsFor(r.key)" :key="o" :value="o">{{ o }}</option>
                        </select>
                        <div class="sync" :title="syncErrors[dkey(r.key)] || ''">
                          <span v-if="syncStatus[dkey(r.key)] === 'pending'" class="badge spike">not saved</span>
                          <span v-else-if="syncStatus[dkey(r.key)] === 'syncing'" class="muted"><span class="spin"></span>saving</span>
                          <span v-else-if="syncStatus[dkey(r.key)] === 'synced'" class="good">✓ saved</span>
                          <span v-else-if="syncStatus[dkey(r.key)] === 'error'" class="badge trend">retry: {{ syncErrors[dkey(r.key)] }}</span>
                        </div>
                        <div v-if="noteMeta(r.key)" class="muted" style="margin-top:2px">{{ noteMeta(r.key) }}</div>
                      </td>
                    </tr>
                  </template>
                  <tr v-if="!rows.length"><td colspan="7" class="muted" style="text-align:left;padding:20px">{{ search || onlyOpen ? 'Nothing matches the filters.' : 'Nothing to review in this count.' }}</td></tr>
                </tbody>
              </table>
            </div>
          </div>
          <div class="muted">Notes are kept in this page and saved every {{ SYNC_SECONDS }} seconds (or with <b>Save now</b>). An item in several sections has one note, shown in each.
            <b>CORRECT</b>: the count is right. <b>REVIEW</b>: count or check it again. <b>ADJUST</b>: fix it in R365 (price, unit, item), then upload the corrected export: notes carry over.
            Items marked <span class="badge impact">High impact</span> ({{ money(highImpactCut) }} or more) are the ones the regional manager's check lists from the same export.</div>
        </template>
      </template>

      <!-- ============================== UPLOAD ============================== -->
      <template v-if="view === 'upload'">
        <div class="row"><h1>Upload a count · {{ activeProperty && activeProperty.name }}</h1></div>
        <div v-if="!session.isAdmin" class="banner warn">Only an administrator of this property can upload counts.</div>
        <div v-else class="card" style="display:flex;flex-direction:column;gap:12px;max-width:820px">
          <p class="muted" style="margin:0">In R365, export the count's <b>Inventory Count Item Details</b> as CSV.
            A beverage count goes to the Beverage tab whole, food-coded cocktail ingredients included; a food count to the Food tab. A full count is split by inventory account.
            Uploading replaces only the tab the file covers.</p>
          <label class="drop" for="csv-file">
            <b>Choose the CSV</b><br><span class="muted">{{ up.fileName || 'InventoryCountItemDetails.csv' }}</span>
            <input id="csv-file" type="file" accept=".csv" @change="onCsvFile">
          </label>
          <div v-if="up.stage === 'reading'" class="muted"><span class="spin"></span>Reading the file…</div>
          <div v-if="up.stage === 'error'" class="banner warn">{{ up.error }}<br><span class="muted">Nothing was changed.</span></div>
          <template v-if="up.preview && (up.stage === 'preview' || up.stage === 'saving')">
            <div class="muted">{{ up.preview.fileName }} · {{ up.preview.rows }} items · reads as a <b>{{ up.preview.kind.toLowerCase() }}</b> count</div>
            <ul class="checks">
              <li><b :class="up.preview.tieOuts ? 'bad' : 'good'">{{ up.preview.tieOuts ? '!' : '✓' }}</b>
                <span v-if="!up.preview.tieOuts">Every item's previous value plus its adjustment equals its current value.</span>
                <span v-else>{{ up.preview.tieOuts }} items do not add up (previous value + adjustment ≠ current value). Check the export.</span></li>
              <li v-for="w in up.preview.warnings" :key="w"><b class="bad">!</b><span>{{ w }}</span></li>
            </ul>
            <div v-for="t in up.preview.tables" :key="t.key" class="card" style="display:flex;flex-direction:column;gap:8px">
              <h2>{{ t.label }} tab</h2>
              <ul class="checks">
                <li><b class="good">✓</b><span>{{ t.items }} items. Value {{ money(t.totals.current) }}, last count {{ money(t.totals.previous) }}
                  (<span :class="cls(t.totals.change)">{{ signed(t.totals.change) }}</span>: price {{ signed(t.totals.priceEffect) }}, quantity {{ signed(t.totals.qtyEffect) }}).</span></li>
                <li><b class="good">✓</b><span>{{ t.review.total }} items to review, {{ t.review.highImpact }} of them high impact:
                  <template v-for="(s, i) in t.review.sections.filter(x => x.items)" :key="s.key">{{ i ? ', ' : '' }}{{ s.label.toLowerCase() }} {{ s.items }}</template>.</span></li>
              </ul>
              <div v-if="!t.existing" class="banner info">No {{ t.label.toLowerCase() }} count on file yet.</div>
              <div v-else-if="t.relation.relation === 'next'" class="banner info">
                <b>Follows the count on file</b> (uploaded {{ dayLabel(t.existing.upload && t.existing.upload.at) }}): its previous figures match.
                Replaces it<template v-if="t.lostNotes"> and its {{ t.lostNotes }} note{{ t.lostNotes === 1 ? '' : 's' }}</template>.
                <template v-if="t.relation.differ"><br>{{ t.relation.differ }} item{{ t.relation.differ === 1 ? '' : 's' }} changed in R365 after that count was reviewed: {{ t.relation.examples.slice(0, 3).join(', ') }}.</template></div>
              <div v-else-if="t.relation.relation === 'recount'" class="banner info">
                <b>The same count again</b> (corrected in R365?). {{ t.keptNotes }} note{{ t.keptNotes === 1 ? '' : 's' }} carry over<template v-if="t.lostNotes">;
                {{ t.lostNotes }} item{{ t.lostNotes === 1 ? ' is' : 's are' }} no longer picked for review and lose their note</template>.</div>
              <div v-else class="banner warn">
                <b>This file does not follow the {{ t.label.toLowerCase() }} count on file.</b>
                {{ t.relation.differ }} of {{ t.relation.compared }} items have a previous quantity that differs from the count on file<template v-if="t.relation.examples.length"> (for example {{ t.relation.examples.slice(0, 2).join('; ') }})</template>.
                Check it is the next count for this property, and that months were uploaded in order. Saving replaces the count on file<template v-if="t.lostNotes"> and its {{ t.lostNotes }} notes</template>.</div>
            </div>
            <div class="controls">
              <button @click="commitCsv" :disabled="up.stage === 'saving'">{{ up.stage === 'saving' ? 'Saving…' : 'Save count' }}</button>
              <button class="ghost" @click="resetUpload" :disabled="up.stage === 'saving'">Cancel</button>
            </div>
          </template>
        </div>
        <div v-if="session.isAdmin" class="card" style="max-width:820px">
          <h3>Remove all count data</h3>
          <p class="muted" style="margin:0 0 10px">Empties both tabs, notes included. Settings stay.</p>
          <button class="danger small" @click="removeAll">Remove all data</button>
        </div>
      </template>
    </main>

    <!-- ============================== SETTINGS ============================== -->
    <div class="overlay" v-if="settingsDraft" @click.self="closeSettings">
      <div class="modal" role="dialog" aria-modal="true" aria-label="Settings">
        <h2>Settings · {{ activeProperty && activeProperty.name }}</h2>
        <div class="banner warn" v-if="settingsError">{{ settingsError }}</div>
        <section>
          <h3>Property admins</h3>
          <p class="muted" style="margin:0 0 6px">Can upload and remove counts and change these settings for this property. Global admins can always do everything.</p>
          <ul class="chip-list"><li v-for="e in settingsDraft.propertyAdmins" :key="e">{{ e }}<button @click="settingsDraft.propertyAdmins = settingsDraft.propertyAdmins.filter(x => x !== e)" :aria-label="'Remove ' + e">×</button></li></ul>
          <div class="controls" style="margin-top:6px"><input type="email" ref="firstSettingsInput" v-model="newAdmin" placeholder="name@company.com" style="flex:1" @keydown.enter.prevent="addEmail('propertyAdmins', 'newAdmin')"><button class="ghost" @click="addEmail('propertyAdmins', 'newAdmin')">Add</button></div>
        </section>
        <section>
          <h3>Property users</h3>
          <p class="muted" style="margin:0 0 6px">Can work through the review and write notes for this property.</p>
          <ul class="chip-list"><li v-for="e in settingsDraft.propertyUsers" :key="e">{{ e }}<button @click="settingsDraft.propertyUsers = settingsDraft.propertyUsers.filter(x => x !== e)" :aria-label="'Remove ' + e">×</button></li></ul>
          <div class="controls" style="margin-top:6px"><input type="email" v-model="newUser" placeholder="name@company.com" style="flex:1" @keydown.enter.prevent="addEmail('propertyUsers', 'newUser')"><button class="ghost" @click="addEmail('propertyUsers', 'newUser')">Add</button></div>
        </section>
        <section>
          <h3>Notes</h3>
          <p class="muted" style="margin:0 0 6px">The notes managers choose from. Each starts with CORRECT, REVIEW or ADJUST.</p>
          <ul class="chip-list"><li v-for="n in settingsDraft.noteCategories" :key="n">{{ n }}<button @click="removeNote(n)" :aria-label="'Remove ' + n">×</button></li></ul>
          <div class="controls" style="margin-top:6px"><input type="text" v-model="newNote" placeholder="ADJUST - WRONG UNIT OF MEASURE" style="flex:1" @keydown.enter.prevent="addNote"><button class="ghost" @click="addNote">Add</button></div>
        </section>
        <section>
          <h3>Reset</h3>
          <p class="muted" style="margin:0 0 6px">Restore this property's admins, users and notes to the defaults.</p>
          <button class="danger small" @click="resetSettingsToDefault">Reset to defaults</button>
        </section>
        <section v-if="bootstrap.isGlobalAdmin">
          <h3>Global admins</h3>
          <p class="muted" style="margin:0 0 6px">Admin on every property. Only global admins see this list.</p>
          <div class="banner warn" v-if="globalError">{{ globalError }}</div>
          <template v-if="globalDraft">
            <ul class="chip-list"><li v-for="e in globalDraft" :key="e">{{ e }}<button @click="removeGlobalAdmin(e)" :aria-label="'Remove ' + e">×</button></li></ul>
            <div class="controls" style="margin-top:6px"><input type="email" v-model="newGlobal" placeholder="name@company.com" style="flex:1" @keydown.enter.prevent="addGlobalAdmin"><button class="ghost" @click="addGlobalAdmin">Add</button>
              <button class="ghost" @click="saveGlobalAdmins">Save global admins</button></div>
          </template>
        </section>
        <div class="controls" style="justify-content:flex-end">
          <button class="ghost" @click="closeSettings">Cancel</button>
          <button @click="saveSettingsDraft">Save settings</button>
        </div>
      </div>
    </div>
  </template>
</div>

<script src="https://cdn.jsdelivr.net/npm/vue@3.4.31/dist/vue.global.prod.js"></script>
<script>
  const PREFIXES = [{ key: 'correct', prefix: 'CORRECT' }, { key: 'review', prefix: 'REVIEW' }, { key: 'adjust', prefix: 'ADJUST' }];
  const MODES = [
    { key: 'impact', label: 'Largest dollar impact first', hint: 'Every item picked for review once, largest dollar impact first. Work down from the top.' },
    { key: 'category', label: 'By section', hint: '' },
    { key: 'account', label: 'By account', hint: 'Grouped by inventory and cost account, so the work can be split (wine, liquor, food …).' },
    { key: 'actions', label: 'Action items (ADJUST / REVIEW)', hint: 'Items marked ADJUST or REVIEW: what to fix in R365 or count again.' }
  ];
  const SYNC_SECONDS = 20;
  const EMAIL = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

  // google.script.run as a promise.
  const gas = (name, ...args) => new Promise((resolve, reject) => {
    google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[name](...args);
  });
  const statusOfNote = note => {
    const n = String(note || '').trim().toUpperCase();
    if (!n) return '';
    const p = PREFIXES.filter(x => n.indexOf(x.prefix) === 0)[0];
    return p ? p.key : 'other';
  };

  Vue.createApp({
    data() {
      return {
        PREFIXES, MODES, SYNC_SECONDS,
        bootLoading: true, bootstrap: { email: '', isGlobalAdmin: false, properties: [] },
        activeProperty: null, view: null, tabs: [], loading: false, loadError: '',
        session: { email: '', isAdmin: false }, settings: { noteCategories: [], propertyAdmins: [], propertyUsers: [] },
        rules: { highImpact: 1000 },
        mode: 'impact', search: '', onlyOpen: false, sticky: {},
        pending: {}, syncStatus: {}, syncErrors: {}, cats: {}, syncing: false,
        up: { stage: null, fileName: '', text: null, preview: null, error: '' },
        settingsDraft: null, settingsError: '', newAdmin: '', newUser: '', newNote: '',
        globalDraft: null, globalError: '', newGlobal: '',
        toasts: [], toastSeq: 0
      };
    },
    computed: {
      activeTab() { return this.tabs.filter(t => t.key === this.view)[0] || null; },
      pendingCount() { return Object.keys(this.pending).length; },
      highImpactCut() { return this.rules.highImpact; },
      reviewKeys() { return this.activeTab ? Object.keys(this.activeTab.review) : []; },
      notedCount() { return this.reviewKeys.filter(k => this.noteOf(k)).length; },
      statusCounts() {
        const s = { correct: 0, review: 0, adjust: 0, other: 0 };
        this.reviewKeys.forEach(k => { const st = this.statusOf(k); if (st) s[st]++; });
        return s;
      },
      highImpactCount() { return this.reviewKeys.filter(k => this.activeTab.review[k].impact >= this.highImpactCut).length; },
      highImpactOpen() { return this.reviewKeys.filter(k => this.activeTab.review[k].impact >= this.highImpactCut && !this.noteOf(k)).length; },
      modeHint() { const m = MODES.filter(x => x.key === this.mode)[0]; return m ? m.hint : ''; },
      rows() {
        const t = this.activeTab;
        if (!t) return [];
        const q = this.search.trim().toLowerCase();
        const keep = key => {
          const it = t.review[key];
          if (!it) return false;
          if (q && it.item.toLowerCase().indexOf(q) === -1) return false;
          if (this.onlyOpen && this.noteOf(key) && !this.sticky[this.dkey(key)]) return false;
          return true;
        };
        const byImpact = (a, b) => t.review[b].impact - t.review[a].impact || a.localeCompare(b);
        const row = (key, cat) => ({ id: (cat || '') + ':' + key, key: key, it: t.review[key], cat: cat || null });
        const out = [];
        if (this.mode === 'category') {
          t.sections.forEach(s => {
            const keys = s.keys.filter(keep);
            if (!keys.length) return;
            out.push({ id: 'h-' + s.key, head: s.label + ' · ' + (keys.length === s.keys.length ? s.keys.length : keys.length + ' of ' + s.keys.length), sub: s.hint });
            keys.forEach(k => out.push(row(k, s.key)));
          });
        } else if (this.mode === 'impact') {
          this.reviewKeys.filter(keep).sort(byImpact).forEach(k => out.push(row(k)));
        } else if (this.mode === 'account') {
          const groups = {};
          this.reviewKeys.filter(keep).forEach(k => {
            const it = t.review[k];
            const g = (it.inventoryAcct || 'No inventory account') + ' · ' + (it.costAcct || 'No cost account');
            (groups[g] = groups[g] || { name: g, keys: [], impact: 0 }).keys.push(k);
            groups[g].impact += it.impact;
          });
          Object.values(groups).sort((a, b) => b.impact - a.impact).forEach(g => {
            out.push({ id: 'h-' + g.name, head: g.name + ' · ' + g.keys.length, sub: this.money(g.impact) + ' dollar impact' });
            g.keys.sort(byImpact).forEach(k => out.push(row(k)));
          });
        } else {
          const rank = { adjust: 0, review: 1 };
          this.reviewKeys.filter(k => keep(k) && rank[this.statusOf(k)] != null)
            .sort((a, b) => rank[this.statusOf(a)] - rank[this.statusOf(b)] || byImpact(a, b)).forEach(k => out.push(row(k)));
        }
        return out;
      }
    },
    mounted() {
      this.loadBootstrap();
      this._timer = setInterval(() => { if (this.pendingCount && !this.syncing) this.syncPending(false); }, SYNC_SECONDS * 1000);
      window.addEventListener('beforeunload', e => { if (this.pendingCount) { e.preventDefault(); e.returnValue = ''; } });
      window.addEventListener('keydown', e => { if (e.key === 'Escape' && this.settingsDraft) this.closeSettings(); });
    },
    methods: {
      /* ---------- formatting ---------- */
      money(v) { const n = Number(v) || 0; return (Math.round(n) < 0 ? '−' : '') + '$' + Math.abs(Math.round(n)).toLocaleString('en-US'); },
      signed(v) { const n = Math.round(Number(v) || 0); return (n > 0 ? '+' : n < 0 ? '−' : '') + '$' + Math.abs(n).toLocaleString('en-US'); },
      signedPct(v) { return (v >= 0 ? '+' : '−') + Math.abs(v).toFixed(1) + '%'; },
      cls(v) { return Math.round(Number(v) || 0) < 0 ? 'bad' : 'good'; },
      qty(v) { const n = Number(v) || 0; return Math.abs(n - Math.round(n)) < 0.005 ? String(Math.round(n)) : n.toFixed(2).replace(/0$/, ''); },
      cost(v) { return '$' + (Number(v) || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); },
      pct(n, d) { return d ? Math.min(100, n / d * 100) : 100; },
      dayLabel(iso) {
        if (!iso) return '—';
        const d = new Date(iso);
        return isNaN(d) ? String(iso).slice(0, 10) : d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
      },
      toast(msg, type) {
        const id = ++this.toastSeq;
        this.toasts.push({ id, msg, type: type || 'success' });
        if (type !== 'error') setTimeout(() => this.dismissToast(id), 3500);
      },
      dismissToast(id) { this.toasts = this.toasts.filter(t => t.id !== id); },

      /* ---------- property and data ---------- */
      async loadBootstrap() {
        try {
          const b = await gas('getBootstrap');
          this.bootstrap = b;
          this.bootLoading = false;
          if (!b.properties.length) return;
          if (b.properties.length === 1) { this.selectProperty(b.properties[0]); return; }
          google.script.url.getLocation(loc => {
            const wanted = loc && loc.parameter && loc.parameter.property;
            this.selectProperty(b.properties.filter(p => p.id === wanted)[0] || b.properties[0]);
          });
        } catch (err) { this.bootLoading = false; this.toast('Could not load properties: ' + err.message, 'error'); }
      },
      onPropertyChange(id) {
        if (this.pendingCount && !confirm(this.pendingCount + ' note(s) are not saved yet and will be lost. Switch anyway?')) return;
        const p = this.bootstrap.properties.filter(x => x.id === id)[0];
        if (p) this.selectProperty(p);
      },
      selectProperty(p) {
        this.activeProperty = p;
        this.tabs = []; this.view = null; this.resetUpload();
        this.loadData(true);
      },
      go(view) { this.view = view; this.sticky = {}; },
      async loadData(force) {
        if (!this.activeProperty) return;
        if (this.pendingCount && !force && !confirm(this.pendingCount + ' note(s) are not saved yet. Refreshing now loses them. Refresh anyway?')) return;
        this.loading = true; this.loadError = '';
        try {
          const d = await gas('getInventoryData', this.activeProperty.id);
          this.tabs = d.tabs; this.session = d.session; this.settings = d.settings; this.rules = d.rules;
          this.pending = {}; this.syncStatus = {}; this.syncErrors = {}; this.cats = {}; this.sticky = {};
          if (!this.view || (this.view !== 'upload' && !this.activeTab)) {
            const first = d.tabs.filter(t => t.items)[0];
            this.view = first ? first.key : (d.session.isAdmin ? 'upload' : d.tabs[0].key);
          }
        } catch (err) { this.loadError = err.message; }
        this.loading = false;
      },

      /* ---------- notes ---------- */
      dkey(key) { return this.view + '|' + key; },
      noteOf(key) {
        const p = this.pending[this.dkey(key)];
        if (p) return p.note;
        const it = this.activeTab && this.activeTab.review[key];
        return it ? it.note || '' : '';
      },
      statusOf(key) { return statusOfNote(this.noteOf(key)); },
      noteMeta(key) {
        if (this.pending[this.dkey(key)]) return '';
        const it = this.activeTab.review[key];
        return it && it.note && it.reviewedBy ? it.reviewedBy + ' · ' + String(it.reviewedAt).slice(0, 16) : '';
      },
      categoryOf(key) {
        const c = this.cats[this.dkey(key)];
        if (c != null) return c;
        const p = PREFIXES.filter(x => x.key === this.statusOf(key))[0];
        return p ? p.prefix : '';
      },
      /** A note-type button: filters the list, and picks the bare type (e.g. "CORRECT") when it is one of the notes. */
      pickCategory(key, prefix) {
        this.cats[this.dkey(key)] = prefix;
        const cur = this.noteOf(key);
        if (cur && cur.toUpperCase().indexOf(prefix) === 0) return;
        if (this.settings.noteCategories.indexOf(prefix) !== -1) this.applyEdit(key, prefix);
      },
      optionsFor(key) {
        const cat = this.categoryOf(key);
        const list = this.settings.noteCategories.filter(o => !cat || o.toUpperCase().indexOf(cat) === 0);
        const cur = this.noteOf(key);
        if (cur && list.indexOf(cur) === -1) list.unshift(cur); // a note since removed from Settings stays visible
        return list;
      },
      applyEdit(key, value) {
        const k = this.dkey(key);
        const it = this.activeTab.review[key];
        if (this.onlyOpen) this.sticky[k] = true;
        if (value === (it.note || '')) { delete this.pending[k]; delete this.syncStatus[k]; delete this.syncErrors[k]; }
        else { this.pending[k] = { datastore: this.view, key: key, row: it.row, item: it.item, note: value }; this.syncStatus[k] = 'pending'; delete this.syncErrors[k]; }
        const p = PREFIXES.filter(x => x.key === statusOfNote(value))[0];
        if (p) this.cats[k] = p.prefix;
      },
      reasons(r) {
        const rs = r.it.reasons || [];
        if (!r.cat) return rs.map(x => x.text);
        return rs.filter(x => x.cat === r.cat).concat(rs.filter(x => x.cat !== r.cat)).map(x => x.text);
      },
      /** Save queued notes. Automatic saves skip entries that already failed; "Save now" retries them. */
      async syncPending(manual) {
        if (this.syncing || !this.activeProperty) return;
        const list = Object.keys(this.pending).filter(k => manual || this.syncStatus[k] !== 'error')
          .map(k => Object.assign({ k: k }, this.pending[k]));
        if (!list.length) return;
        this.syncing = true;
        list.forEach(e => { this.syncStatus[e.k] = 'syncing'; });
        let failed = 0, firstError = '';
        try {
          const res = await gas('saveNotesBatch', this.activeProperty.id, list.map(e => ({ datastore: e.datastore, row: e.row, note: e.note, expectedItem: e.item })));
          res.results.forEach((r, i) => {
            const e = list[i];
            if (!r.ok) { failed++; firstError = firstError || r.error; this.syncStatus[e.k] = 'error'; this.syncErrors[e.k] = r.error; return; }
            const changedSince = this.pending[e.k] && this.pending[e.k].note !== e.note;
            if (!changedSince) delete this.pending[e.k];
            const tab = this.tabs.filter(t => t.key === e.datastore)[0];
            const it = tab && tab.review[e.key];
            if (it) { it.note = e.note; it.status = r.status; it.reviewedBy = r.by; it.reviewedAt = r.at; }
            if (tab) tab.counts.reviewed = Object.keys(tab.review).filter(x => tab.review[x].note).length;
            delete this.syncErrors[e.k];
            this.syncStatus[e.k] = changedSince ? 'pending' : 'synced';
            if (!changedSince) setTimeout(() => { if (this.syncStatus[e.k] === 'synced') delete this.syncStatus[e.k]; }, 2500);
          });
        } catch (err) {
          failed = list.length; firstError = err.message;
          list.forEach(e => { this.syncStatus[e.k] = 'error'; this.syncErrors[e.k] = err.message; });
        }
        this.syncing = false;
        if (failed) this.toast(failed + ' note' + (failed === 1 ? '' : 's') + ' could not be saved: ' + firstError, 'error');
      },

      /* ---------- upload ---------- */
      onCsvFile(e) {
        const f = e.target.files[0]; if (!f) return;
        const reader = new FileReader();
        reader.onload = async ev => {
          e.target.value = '';
          this.up = { stage: 'reading', fileName: f.name, text: ev.target.result, preview: null, error: '' };
          try {
            this.up.preview = await gas('previewUpload', this.activeProperty.id, this.up.text, f.name);
            this.up.stage = 'preview';
          } catch (err) { this.up.stage = 'error'; this.up.error = err.message; }
        };
        reader.readAsText(f);
      },
      async commitCsv() {
        if (this.pendingCount) await this.syncPending(true);
        this.up.stage = 'saving';
        try {
          const res = await gas('commitUpload', this.activeProperty.id, this.up.text, this.up.fileName);
          this.toast('Saved: ' + res.tables.map(t => t.label + ' ' + t.items + ' items, ' + t.review + ' to review' + (t.keptNotes ? ', ' + t.keptNotes + ' notes kept' : '')).join('; ') + '.');
          this.resetUpload();
          this.view = res.tables[0].key;
          await this.loadData(true);
        } catch (err) { this.up.stage = 'error'; this.up.error = err.message; }
      },
      resetUpload() { this.up = { stage: null, fileName: '', text: null, preview: null, error: '' }; },
      async removeAll() {
        if (!confirm('Empty both tabs of ' + this.activeProperty.name + ', notes included? This cannot be undone.')) return;
        try { await gas('removeAllCountData', this.activeProperty.id); this.toast('All count data removed.'); await this.loadData(true); }
        catch (err) { this.toast(err.message, 'error'); }
      },

      /* ---------- settings ---------- */
      openSettings() {
        this.settingsDraft = { propertyAdmins: this.settings.propertyAdmins.slice(), propertyUsers: this.settings.propertyUsers.slice(),
          noteCategories: this.settings.noteCategories.slice() };
        this.settingsError = ''; this.newAdmin = ''; this.newUser = ''; this.newNote = '';
        this.globalDraft = null; this.globalError = ''; this.newGlobal = '';
        if (this.bootstrap.isGlobalAdmin) gas('getGlobalAdmins').then(l => { this.globalDraft = l.slice(); }).catch(err => { this.globalError = err.message; });
        this.$nextTick(() => { if (this.$refs.firstSettingsInput) this.$refs.firstSettingsInput.focus(); });
      },
      closeSettings() { this.settingsDraft = null; },
      addEmail(list, field) {
        const e = this[field].trim();
        if (!e) return;
        if (!EMAIL.test(e)) { this.settingsError = 'Enter a valid email address.'; return; }
        if (!this.settingsDraft[list].some(x => x.toLowerCase() === e.toLowerCase())) this.settingsDraft[list].push(e);
        this[field] = ''; this.settingsError = '';
      },
      addNote() {
        const n = this.newNote.trim().toUpperCase();
        if (!n) return;
        if (!/^(CORRECT|REVIEW|ADJUST)/.test(n)) { this.settingsError = 'A note must start with CORRECT, REVIEW or ADJUST.'; return; }
        if (this.settingsDraft.noteCategories.indexOf(n) === -1) this.settingsDraft.noteCategories.push(n);
        this.newNote = ''; this.settingsError = '';
      },
      removeNote(n) {
        if (this.settingsDraft.noteCategories.length <= 1) { this.settingsError = 'At least one note is required.'; return; }
        this.settingsDraft.noteCategories = this.settingsDraft.noteCategories.filter(x => x !== n);
      },
      async saveSettingsDraft() {
        this.settingsError = '';
        try {
          const s = await gas('saveSettings', this.activeProperty.id, this.settingsDraft);
          this.settings = s; this.settingsDraft = null; this.toast('Settings saved.');
        } catch (err) { this.settingsError = err.message; }
      },
      async resetSettingsToDefault() {
        if (!confirm('Reset this property\'s admins, users and notes to the defaults?')) return;
        try {
          const s = await gas('resetSettings', this.activeProperty.id);
          this.settings = s;
          this.settingsDraft = { propertyAdmins: s.propertyAdmins.slice(), propertyUsers: s.propertyUsers.slice(), noteCategories: s.noteCategories.slice() };
          this.toast('Settings reset to defaults.');
        } catch (err) { this.settingsError = err.message; }
      },
      addGlobalAdmin() {
        const e = this.newGlobal.trim();
        if (!e) return;
        if (!EMAIL.test(e)) { this.globalError = 'Enter a valid email address.'; return; }
        if (!this.globalDraft.some(x => x.toLowerCase() === e.toLowerCase())) this.globalDraft.push(e);
        this.newGlobal = ''; this.globalError = '';
      },
      removeGlobalAdmin(e) {
        if (this.globalDraft.length <= 1) { this.globalError = 'At least one global admin is required.'; return; }
        if (this.session.email && e.toLowerCase() === this.session.email.toLowerCase() && !confirm('This removes your own global admin access. Continue?')) return;
        this.globalDraft = this.globalDraft.filter(x => x !== e);
      },
      async saveGlobalAdmins() {
        this.globalError = '';
        try { this.globalDraft = (await gas('saveGlobalAdmins', this.globalDraft)).slice(); this.toast('Global admins saved.'); }
        catch (err) { this.globalError = err.message; }
      }
    }
  }).mount('#app');
</script>
