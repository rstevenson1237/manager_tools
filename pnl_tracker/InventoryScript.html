<script>
  /* Regional inventory check (included by Index.html before the main script).
   * The main app mixes this in: it shares boot, go(), toast() and the number
   * formatting. The regional manager uploads each property's count export
   * (several at once); the report lists what is still worth asking the store
   * about. There are no notes here: the store teams review in inventory_audit. */
  /** The month a count closes: last month until the 20th, then this month. */
  const invDefaultPeriod = () => {
    const d = new Date();
    if (d.getDate() <= 20) d.setDate(0);
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
  };
  const invByName = (a, b) => String(a.name).localeCompare(String(b.name));
  const invNorm = s => String(s || '').toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim();

  const InventoryMixin = {
    data() {
      return {
        inv: {
          sub: 'dashboard', dash: null, dashLoading: false, dashError: '',
          repKey: null, rep: null, repLoading: false, repError: '', showOthers: false, copyText: '',
          up: { period: invDefaultPeriod(), files: [], saving: false, seq: 0 }
        }
      };
    },
    computed: {
      invCanEdit() { return !!this.boot.canEditInventory; },
      invSubViews() {
        const v = [{ key: 'dashboard', label: 'Dashboard' }, { key: 'report', label: 'Report' }];
        return this.invCanEdit ? v.concat([{ key: 'upload', label: 'Upload' }]) : v;
      },
      invProperties() {
        const by = {};
        (this.boot.properties || []).concat(this.inv.dash ? this.inv.dash.properties : []).forEach(p => { if (!by[p.code]) by[p.code] = p; });
        return Object.values(by).filter(p => p.active !== false).sort(invByName);
      },
      invChecks() { return this.inv.dash ? this.inv.dash.checks : []; },
      /** One row per property and month, newest month first. */
      invMonths() {
        const by = {};
        this.invChecks.forEach(c => {
          const k = c.property + '|' + c.period;
          const m = by[k] = by[k] || { key: k, property: c.property, period: c.period, counts: [], value: 0, prev: 0, picked: 0, high: 0, highValue: 0, tieOuts: 0, notCounted: 0 };
          m.counts.push(c); m.value += c.current; m.prev += c.previous; m.picked += c.picked;
          m.high += c.highImpact; m.highValue += c.highImpactValue; m.tieOuts += c.tieOuts; m.notCounted += c.notCounted;
        });
        return Object.values(by).sort((a, b) => b.period.localeCompare(a.period) || this.propertyName(a.property).localeCompare(this.propertyName(b.property)));
      },
      invLatest() {
        const latest = this.invMonths.length ? this.invMonths[0].period : null;
        const rows = this.invMonths.filter(m => m.period === latest);
        return { period: latest, rows: rows, high: rows.reduce((s, m) => s + m.high, 0), highValue: rows.reduce((s, m) => s + m.highValue, 0),
          clean: rows.filter(m => !m.high && !m.tieOuts).length };
      },
      invReportOptions() { return this.invMonths.map(m => ({ key: m.key, property: m.property, period: m.period })); },
      invRep() { return this.inv.rep && this.inv.rep.report; },
      invUpReady() { return this.inv.up.files.filter(f => f.stage === 'preview' && !f.preview.duplicateOf); },
      invLabelChoices() {
        const out = ['Food', 'Beverage', 'Full count'];
        this.invChecks.forEach(c => { if (!out.some(l => l.toLowerCase() === c.label.toLowerCase())) out.push(c.label); });
        return out;
      }
    },
    methods: {
      qty(v) { if (v == null || v === '' || isNaN(v)) return '—'; const n = Number(v); return Math.abs(n - Math.round(n)) < 0.005 ? String(Math.round(n)) : n.toFixed(2).replace(/0$/, ''); },
      cost(v) { if (v == null || v === '' || isNaN(v)) return '—'; return '$' + Number(v).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); },
      invKpi(k) {
        if (k.kind === 'money') return k.signed ? this.signed(k.value) : this.money(k.value);
        if (k.kind === 'days') return Math.round(k.value);
        return String(k.value);
      },
      invFollowsText(f) {
        if (!f || f.status === 'first') return 'First count on file';
        if (f.status === 'gap') return 'Last count on file is ' + this.monthLabel(f.period);
        if (f.status === 'differs') return 'Does not follow ' + this.monthLabel(f.period, true);
        const since = [f.changedBy ? this.signed(f.changedBy) + ' on its total' : '', f.items ? f.items + ' picked item' + (f.items === 1 ? '' : 's') : ''].filter(Boolean);
        return 'Follows ' + this.monthLabel(f.period, true) + (since.length ? ' (changed since: ' + since.join(', ') + ')' : '');
      },

      /* ---------- navigation ---------- */
      invEnter() { this.invGo(this.inv.sub); },
      async invGo(sub) {
        this.inv.sub = sub;
        if (sub === 'dashboard' || !this.inv.dash) await this.loadInvDash();
        if (sub === 'report') this.loadInvReport();
      },
      async loadInvDash() {
        this.inv.dashLoading = true; this.inv.dashError = '';
        try { this.inv.dash = await gas('getInventoryDashboard'); }
        catch (err) { this.inv.dashError = err.message; }
        this.inv.dashLoading = false;
      },
      openInvReport(property, period) {
        this.inv.repKey = property + '|' + period;
        if (this.view !== 'inventory') this.view = 'inventory';
        this.invGo('report');
      },

      /* ---------- report ---------- */
      async loadInvReport() {
        const opts = this.invReportOptions;
        if (!opts.length) { this.inv.rep = null; return; }
        if (!opts.some(o => o.key === this.inv.repKey)) this.inv.repKey = opts[0].key;
        const i = this.inv.repKey.lastIndexOf('|');
        this.inv.repLoading = true; this.inv.repError = ''; this.inv.showOthers = false; this.inv.copyText = '';
        try { this.inv.rep = await gas('getInventoryReport', this.inv.repKey.slice(0, i), this.inv.repKey.slice(i + 1)); }
        catch (err) { this.inv.rep = null; this.inv.repError = err.message; }
        this.inv.repLoading = false;
      },
      /** The questions as plain text, to paste into an email to the store manager. */
      invQuestionsText() {
        const r = this.invRep;
        const lines = [this.propertyName(r.property) + ' · ' + this.monthLabel(r.period) + ' inventory: questions', ''];
        r.issues.forEach(x => lines.push('! ' + x));
        if (r.issues.length) lines.push('');
        r.questions.forEach((q, i) => {
          lines.push((i + 1) + '. ' + q.item + (r.counts.length > 1 ? ' (' + q.countLabel + ')' : '') + ': $' + this.money(q.impact));
          q.reasons.forEach(x => lines.push('   ' + x));
          if (q.history) lines.push('   ' + q.history);
        });
        if (!r.questions.length) lines.push('No items of $' + this.money(r.highImpact) + ' or more to ask about.');
        return lines.join('\n');
      },
      async invCopy() {
        const text = this.invQuestionsText();
        this.inv.copyText = text;
        try { await navigator.clipboard.writeText(text); this.toast('Questions copied. Paste them into an email to the store.', 'success'); }
        catch (e) { this.$nextTick(() => { const el = document.getElementById('inv-copy'); if (el) { el.focus(); el.select(); } }); }
      },

      /* ---------- upload (several files at once) ---------- */
      /** The property a file name points to: a property name or code inside it, longest match first. */
      invGuessProperty(fileName) {
        const name = ' ' + invNorm(fileName) + ' ';
        const hits = this.invProperties.map(p => {
          const words = [invNorm(p.name), invNorm(p.code)].filter(Boolean);
          const w = words.filter(x => name.indexOf(' ' + x + ' ') !== -1).sort((a, b) => b.length - a.length)[0];
          return w ? { code: p.code, len: w.length } : null;
        }).filter(Boolean).sort((a, b) => b.len - a.len);
        return hits.length ? hits[0].code : '';
      },
      onInvFiles(e) {
        Array.from(e.target.files || []).forEach(f => {
          const reader = new FileReader();
          const entry = { id: ++this.inv.up.seq, fileName: f.name, text: null, property: this.invGuessProperty(f.name), label: '', stage: 'reading', preview: null, error: '', result: null, previewSeq: 0 };
          this.inv.up.files.push(entry);
          reader.onload = ev => { const x = this.inv.up.files.filter(y => y.id === entry.id)[0]; if (x) { x.text = ev.target.result; this.previewInvFile(x); } };
          reader.readAsText(f);
        });
        e.target.value = '';
      },
      invRepreviewAll() { this.inv.up.files.forEach(f => { if (f.text && f.stage !== 'saved') this.previewInvFile(f); }); },
      invRepreviewSoon(f) { clearTimeout(f._t); f._t = setTimeout(() => this.previewInvFile(f), 500); },
      async previewInvFile(f) {
        const seq = ++f.previewSeq;
        f.error = ''; f.result = null;
        if (!f.property) { f.stage = 'error'; f.preview = null; f.error = 'Choose the property.'; return; }
        if (!/^\d{4}-\d{2}$/.test(this.inv.up.period || '')) { f.stage = 'error'; f.preview = null; f.error = 'Enter the month the counts close, as YYYY-MM.'; return; }
        f.stage = 'reading';
        try {
          const p = await gas('previewInventoryUpload', f.text, f.fileName, f.property, this.inv.up.period, f.label);
          if (seq !== f.previewSeq) return;
          if (!f.label) f.label = p.target.label;
          f.preview = p; f.stage = 'preview';
        } catch (err) { if (seq !== f.previewSeq) return; f.preview = null; f.stage = 'error'; f.error = err.message; }
      },
      invDropFile(f) { this.inv.up.files = this.inv.up.files.filter(x => x !== f); },
      async commitInvAll() {
        this.inv.up.saving = true;
        let saved = 0;
        for (const f of this.invUpReady) {
          f.stage = 'saving';
          try {
            f.result = await gas('commitInventoryUpload', f.text, f.fileName, f.property, this.inv.up.period, f.label || f.preview.target.label);
            f.stage = 'saved'; saved++;
          } catch (err) { f.stage = 'error'; f.error = err.message; }
        }
        this.inv.up.saving = false;
        if (saved) this.toast('Saved ' + saved + ' count' + (saved === 1 ? '' : 's') + '.', 'success');
        await this.loadInvDash();
      },
      invClearSaved() { this.inv.up.files = this.inv.up.files.filter(f => f.stage !== 'saved'); },
      async removeInvCount(c) {
        if (!confirm('Remove the ' + c.label + ' check for ' + this.propertyName(c.property) + ', ' + this.monthLabel(c.period) + '?')) return;
        try { await gas('removeInventoryCount', c.id); this.toast('Check removed.', 'success'); await this.loadInvDash(); }
        catch (err) { this.toast(err.message, 'error'); }
      }
    }
  };
</script>
