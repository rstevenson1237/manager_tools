<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <style>
    :root{--brand:#1F5FAD;--brand-dark:#163F73;--brand-soft:#E8EFF8;--ink:#1A1D21;--muted:#5A6069;--line:#E2E2DC;
      --ground:#F6F6F3;--good:#1F5FAD;--bad:#9A4508;--bad-soft:#FFF4E8;--bad-line:#EBC9A3;--danger:#b3271b;}
    *{box-sizing:border-box;}
    [v-cloak]{display:none;}
    body{font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;margin:0;background:var(--ground);color:var(--ink);font-size:14px;}
    nav.top{background:#fff;border-bottom:1px solid var(--line);padding:10px 16px;display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;}
    nav.top .title{font-weight:700;font-size:16px;}
    nav.top .tabs{display:flex;flex-wrap:wrap;gap:4px;}
    nav.top .tab{background:none;border:none;padding:10px 14px;border-radius:8px;font-size:14px;color:#3D434B;cursor:pointer;min-height:40px;}
    nav.top .tab.active{background:var(--brand-soft);color:var(--brand-dark);font-weight:600;}
    nav.top .who{margin-left:auto;font-size:12px;color:var(--muted);}
    main{max-width:1200px;margin:0 auto;padding:20px 16px 60px;display:flex;flex-direction:column;gap:16px;}
    h1{margin:0;font-size:24px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;}
    h2{margin:0;font-size:16px;}
    .row{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between;}
    .controls{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;}
    .field{display:flex;flex-direction:column;gap:4px;}
    .field label{font-size:12px;color:var(--muted);}
    select,input[type=text],input[type=date],input[type=number],input[type=email],textarea{font:inherit;min-height:40px;padding:0 10px;border:1px solid #C9CCD1;border-radius:8px;background:#fff;color:var(--ink);}
    textarea{padding:10px;min-height:80px;width:100%;resize:vertical;}
    button{font:inherit;font-weight:600;background:var(--brand);color:#fff;border:none;padding:0 16px;min-height:40px;border-radius:8px;cursor:pointer;}
    button:hover:not(:disabled){background:var(--brand-dark);}
    button:disabled{background:#C9CCD1;cursor:not-allowed;}
    button.ghost{background:#fff;color:var(--ink);border:1px solid #C9CCD1;}
    button.ghost:hover:not(:disabled){background:#F1F2EF;}
    button.danger{background:var(--danger);}
    button.small{min-height:30px;padding:0 10px;font-size:12px;}
    button.link{background:none;color:var(--brand);padding:0;min-height:0;font-weight:600;}
    .card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;}
    .card.flush{padding:0;overflow:hidden;}
    .card .head{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:6px 14px;justify-content:space-between;align-items:baseline;}
    .grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));}
    .grid.wide{grid-template-columns:repeat(auto-fit,minmax(320px,1fr));}
    .stat .label{font-size:12px;color:var(--muted);font-weight:600;}
    .stat .value{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;}
    .stat .sub{font-size:12px;color:var(--muted);}
    .hero{background:var(--ink);color:#fff;border-radius:12px;padding:18px 20px;display:flex;flex-direction:column;gap:6px;}
    .hero .label{font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:#C9CED6;font-weight:600;}
    .hero .value{font-size:36px;font-weight:700;font-variant-numeric:tabular-nums;}
    .hero .good{color:#9CC0F0;} .hero .bad{color:#F3C893;}
    .hero .warn{font-size:13px;color:#F3C893;border-top:1px solid #3A3F46;padding-top:8px;margin-top:4px;}
    .good{color:var(--good);} .bad{color:var(--bad);} .muted{color:var(--muted);font-size:12px;}
    .badge{display:inline-block;font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;letter-spacing:.02em;white-space:nowrap;}
    .badge.mtd{background:#EFEAF8;color:#4B3590;}
    .badge.preliminary{background:var(--bad-soft);color:#6B3608;border:1px solid #C9772E;}
    .badge.settled{background:var(--brand-soft);color:var(--brand-dark);}
    .badge.trend{background:var(--bad);color:#fff;} .badge.spike{background:#E8E9E6;color:#3D434B;}
    .badge.new{background:#5A3FA0;color:#fff;} .badge.pace{background:#EFEAF8;color:#4B3590;}
    .badge.timing{background:#E8E9E6;color:#3D434B;border:1px dashed #8A9099;}
    .banner{border-radius:10px;padding:12px 16px;font-size:13px;line-height:1.5;}
    .banner.warn{background:var(--bad-soft);border:1px solid var(--bad-line);color:#4A2A0A;}
    .banner.info{background:var(--brand-soft);border:1px solid #C9D8EE;color:var(--brand-dark);}
    .scroll{overflow-x:auto;}
    table{border-collapse:collapse;width:100%;}
    th,td{padding:7px 10px;border-bottom:1px solid #EDEDE8;font-size:13px;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;}
    th{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:600;background:#FAFAF8;position:sticky;top:0;}
    td:first-child,th:first-child{text-align:left;}
    tr.sec td{background:var(--ground);font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:#4A5058;padding-top:10px;}
    tr.total td{font-weight:700;background:#FCFCFA;border-bottom:1px solid #D5D7D2;}
    tr.key td{font-weight:800;background:var(--brand-soft);font-size:14px;}
    tr.clickable{cursor:pointer;} tr.clickable:hover td{background:#F7F9FC;}
    td.indent{padding-left:20px;}
    .flag-card{border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:8px;background:#fff;}
    .flag-card.tagged{opacity:.65;}
    .flag-card .driver{display:flex;justify-content:space-between;gap:10px;font-size:13px;border-top:1px solid #F0F0EC;padding-top:6px;}
    .bar{position:relative;height:22px;background:#F3F4F1;border-radius:4px;min-width:120px;}
    .bar .fill{position:absolute;left:0;top:0;bottom:0;border-radius:4px;}
    .bar .mark{position:absolute;top:-3px;bottom:-3px;border-left:2px dashed var(--ink);}
    .bar .txt{position:absolute;right:8px;top:3px;font-size:12px;font-weight:700;}
    .months{display:grid;gap:4px;}
    .chip{font-size:11px;text-align:center;padding:5px 0;border-radius:6px;border:1px dashed #C9CCD1;color:var(--muted);background:var(--ground);}
    .chip.settled{background:var(--brand);color:#fff;border:1px solid var(--brand);font-weight:600;}
    .chip.preliminary{background:var(--bad-soft);color:#6B3608;border:1px solid #C9772E;font-weight:700;}
    .chip.mtd{background:#EFEAF8;color:#4B3590;border:1px solid #9C8BD0;font-weight:700;}
    .drop{border:2px dashed #B9C6D6;border-radius:12px;padding:22px;text-align:center;cursor:pointer;background:#fff;display:block;}
    .drop input{display:none;}
    .checks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;}
    .checks li{display:flex;gap:8px;align-items:flex-start;font-size:13px;}
    .toast-stack{position:fixed;top:16px;right:16px;z-index:60;display:flex;flex-direction:column;gap:8px;max-width:340px;}
    .toast{padding:10px 36px 10px 12px;border-radius:8px;font-weight:600;font-size:13px;box-shadow:0 2px 10px rgba(0,0,0,.18);position:relative;}
    .toast-close{position:absolute;top:4px;right:4px;background:none;color:inherit;min-height:0;padding:4px 8px;opacity:.6;}
    .s-loading{background:var(--brand-soft);color:var(--brand);} .s-success{background:#d4edda;color:#155724;} .s-error{background:#f8d7da;color:#721c24;}
    .spin{display:inline-block;width:14px;height:14px;border:2px solid #cfe0ff;border-top-color:var(--brand);border-radius:50%;animation:s .8s linear infinite;vertical-align:middle;margin-right:6px;}
    @keyframes s{to{transform:rotate(360deg);}}
    .empty{padding:60px 20px;text-align:center;color:var(--muted);}
    .overlay{position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:50;display:flex;align-items:center;justify-content:center;}
    .modal{background:#fff;border-radius:12px;max-width:680px;width:94%;max-height:88vh;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:14px;}
    .chip-list{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px;}
    .chip-list li{background:#F1F3F4;border-radius:12px;padding:4px 6px 4px 10px;font-size:12px;display:flex;align-items:center;gap:6px;}
    .chip-list li button{background:none;color:var(--danger);min-height:0;padding:0 4px;}
    svg text{font-family:inherit;}
    .review-list{display:flex;flex-direction:column;}
    .review-item{border-top:1px solid #F0F0EC;padding:10px 0;display:flex;flex-direction:column;gap:4px;font-size:13px;}
    .review-item:first-child{border-top:none;padding-top:0;}
    .review-item .track{font-size:12px;color:#3D434B;display:flex;flex-wrap:wrap;gap:6px;align-items:center;}
    .sub-head{font-size:14px;margin:16px 0 4px;}
    .badge.draft{background:#FFF7D6;color:#5C4400;border:1px solid #D9B648;}
    .badge.approved{background:var(--brand-soft);color:var(--brand-dark);}
    /* P&L table: header row and line column stay put while the numbers scroll */
    .pl-scroll{overflow:auto;max-height:75vh;overscroll-behavior:contain;}
    .pl-scroll th{z-index:2;box-shadow:inset 0 -1px 0 #E2E2DC;}
    .pl-scroll td{background:#fff;}
    .pl-scroll .line-col{position:sticky;left:0;z-index:1;white-space:normal;overflow-wrap:anywhere;box-shadow:inset -1px 0 0 #E2E2DC;}
    .pl-scroll th.line-col{z-index:3;box-shadow:inset -1px 0 0 #E2E2DC,inset 0 -1px 0 #E2E2DC;}
    .pl-scroll tr.sec td .sec-label{position:sticky;left:10px;}
    .col-resize{position:absolute;top:0;right:-5px;bottom:0;width:10px;cursor:col-resize;touch-action:none;z-index:4;display:flex;justify-content:center;}
    .col-resize::after{content:'';width:3px;margin:6px 0;border-radius:2px;background:#C9CCD1;}
    .col-resize:hover::after,.col-resize:focus-visible::after,.col-resize.dragging::after{background:var(--brand);}
    .col-resize:focus-visible{outline:none;}
    body.resizing{cursor:col-resize;user-select:none;}
    @media print{nav.top,.no-print,.toast-stack{display:none !important;} body{background:#fff;} main{padding:0;} .card{break-inside:avoid;}
      .pl-scroll{max-height:none;overflow:visible;} .pl-scroll .line-col,.pl-scroll th{position:static;} .col-resize{display:none;}}
  </style>
</head>
<body>
<div id="app" v-cloak>
  <div class="toast-stack">
    <div v-for="t in toasts" :key="t.id" :class="['toast', 's-' + t.type]">{{ t.msg }}
      <button class="toast-close" @click="dismissToast(t.id)" aria-label="Dismiss">×</button>
    </div>
  </div>

  <div v-if="bootLoading" class="empty"><span class="spin"></span>Loading…</div>
  <div v-else-if="!boot.configured" class="empty">
    The P&amp;L Tracker is not set up yet.<br>In the Apps Script editor, run <b>setup()</b> once, then reload this page.
  </div>
  <div v-else-if="!boot.role" class="empty">
    You do not have access to the P&amp;L Tracker.<br>Signed in as {{ boot.email || 'an unknown account' }}. Ask an administrator to add you as a viewer.
  </div>

  <template v-else>
    <nav class="top">
      <div class="title">P&amp;L Tracker</div>
      <div class="tabs">
        <button v-for="v in visibleViews" :key="v.key" :class="['tab', { active: view === v.key }]" @click="go(v.key)">{{ v.label }}</button>
      </div>
      <div class="who">{{ boot.email }}<template v-if="boot.isAdmin"> · admin</template></div>
    </nav>

    <main>
      <div v-if="!periods.length && view !== 'upload'" class="card empty">
        Nothing uploaded yet.
        <template v-if="boot.isAdmin"><br><br><button @click="go('upload')">Upload a P&amp;L</button></template>
      </div>

      <!-- ============================== PORTFOLIO ============================== -->
      <template v-if="view === 'portfolio' && periods.length">
        <div class="row">
          <div>
            <div class="muted">{{ portfolio ? portfolio.totals.properties + ' properties · ranked by operating income %' : '' }}</div>
            <h1>Portfolio · {{ groupLabel(period, grouping) }} <span v-if="portfolioStage" :class="['badge', portfolioStage]">{{ stageLabel(portfolioStage) }}</span></h1>
          </div>
          <div class="controls no-print">
            <div class="field"><label for="pf-group">Show</label>
              <select id="pf-group" v-model="grouping" @change="setGrouping">
                <option v-for="gr in GROUPINGS" :key="gr.key" :value="gr.key">{{ gr.label }}</option>
              </select></div>
            <div class="field"><label for="pf-period">{{ groupingNoun }}</label>
              <select id="pf-period" v-model="period" @change="loadPortfolio">
                <option v-for="o in periodOptions(periods)" :key="o.value" :value="o.value">{{ o.label }}</option>
              </select></div>
          </div>
        </div>
        <div v-if="loading.portfolio" class="muted"><span class="spin"></span>Loading…</div>
        <template v-if="portfolio && !loading.portfolio">
          <div class="banner warn" v-if="portfolioMissing">
            {{ portfolioMissing }} of {{ portfolio.totals.properties }} properties are missing recurring lines this month
            (for example the management fee or commission). Their operating income looks higher than it will once those post.
          </div>
          <div class="grid">
            <div class="card stat"><div class="label">Operating income</div><div class="value">{{ money(portfolio.totals.oi) }}</div>
              <div class="sub">{{ pct(portfolio.totals.oiPct) }} of sales</div></div>
            <div class="card stat"><div class="label">Net sales</div><div class="value">{{ money(portfolio.totals.net) }}</div>
              <div class="sub">{{ portfolio.totals.properties }} properties on file</div></div>
            <div class="card stat"><div class="label">Prime cost %</div><div class="value">{{ pct(portfolio.totals.primePct) }}</div>
              <div class="sub">Labor {{ pct(portfolio.totals.laborPct) }}</div></div>
            <div class="card stat" v-if="grouping === 'month'"><div class="label">Flags</div><div class="value">{{ portfolioFlags }}</div>
              <div class="sub">across {{ portfolio.totals.properties }} properties</div></div>
            <div class="card stat" v-else><div class="label">Months covered</div><div class="value">{{ portfolio.months.length }}</div>
              <div class="sub">{{ spanLabel(portfolio.months) }} · flags are in each month's report</div></div>
          </div>
          <div class="card flush">
            <div class="head"><h2>Properties side by side</h2><span class="muted">Dashed line = portfolio {{ pct(portfolio.totals.oiPct) }} · select a row for its report</span></div>
            <div class="scroll">
              <table style="min-width:960px">
                <thead><tr><th>Property</th><th>Net sales</th><th>Operating income</th><th style="text-align:left;width:24%">OI % of sales</th><th>{{ priorLabel }}</th>
                  <th>Prime %</th><th>Labor %</th><th>vs budget</th><th>vs last year</th><th>{{ grouping === 'month' ? 'Flags' : 'Months' }}</th></tr></thead>
                <tbody>
                  <tr v-for="r in portfolio.rows" :key="r.code" :class="{ clickable: r.onFile }" @click="r.onFile && openReport(r.code, period)">
                    <td><b>{{ r.name }}</b> <span v-if="r.onFile && r.stage !== portfolioStage" :class="['badge', r.stage]">{{ stageLabel(r.stage) }}</span></td>
                    <template v-if="r.onFile">
                      <td>{{ money(r.net) }}</td>
                      <td><b>{{ money(r.oi) }}</b></td>
                      <td style="text-align:left"><div style="display:flex;gap:8px;align-items:center">
                        <div class="bar" style="flex:1">
                          <div class="fill" :style="{ width: barWidth(r.oiPct), background: r.oiPct < portfolio.totals.oiPct ? '#C9772E' : 'var(--brand)' }"></div>
                          <div class="mark" :style="{ left: barWidth(portfolio.totals.oiPct) }"></div></div>
                        <b style="min-width:48px;text-align:right">{{ pct(r.oiPct) }}</b></div></td>
                      <td class="muted">{{ pct(r.prevOiPct) }}</td>
                      <td>{{ pct(r.primePct) }}</td><td>{{ pct(r.laborPct) }}</td>
                      <td :class="cls(r.varBudgetOi)">{{ r.budgetOi == null ? '—' : signed(r.varBudgetOi) }}</td>
                      <td :class="cls(r.varLyOi)">{{ r.lyOi == null ? '—' : signed(r.varLyOi) }}</td>
                      <td v-if="grouping === 'month'"><span v-if="r.flags" class="bad"><b>{{ r.flags }}</b></span><span v-else class="muted">0</span>
                        <span v-if="r.missing" class="muted"> · {{ r.missing }} missing</span></td>
                      <td v-else :class="{ muted: r.months === portfolio.months.length }">{{ r.months }} of {{ portfolio.months.length }}</td>
                    </template>
                    <td v-else colspan="9" class="muted" style="text-align:left">No data for this {{ grouping === 'month' ? 'month' : 'period' }}</td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </template>
      </template>

      <!-- ============================== PERIOD REPORT ============================== -->
      <template v-if="view === 'report' && periods.length">
        <div class="row no-print">
          <div class="controls">
            <div class="field"><label for="rp-prop">Property</label>
              <select id="rp-prop" v-model="property" @change="loadReport">
                <option v-for="p in activeProperties" :key="p.code" :value="p.code">{{ p.name }}</option>
              </select></div>
            <div class="field"><label for="rp-group">Show</label>
              <select id="rp-group" v-model="grouping" @change="setGrouping">
                <option v-for="gr in GROUPINGS" :key="gr.key" :value="gr.key">{{ gr.label }}</option>
              </select></div>
            <div class="field"><label for="rp-period">{{ groupingNoun }}</label>
              <select id="rp-period" v-model="period" @change="loadReport">
                <option v-for="o in periodOptions(periodsFor(property))" :key="o.value" :value="o.value">{{ o.label }}</option>
              </select></div>
          </div>
          <button class="ghost" @click="printPage" :disabled="!report">Print / save as PDF</button>
        </div>
        <div v-if="loading.report" class="muted"><span class="spin"></span>Loading…</div>
        <div v-else-if="reportError" class="banner warn">{{ reportError }}</div>
        <template v-if="report && !loading.report">
          <div>
            <div class="muted">{{ stageSentence(report) }}</div>
            <h1>{{ propertyName(report.property) }} · {{ reportGrouped ? groupLabel(report.period, report.grouping) : monthLabel(report.period) }} <span :class="['badge', report.stage]">{{ stageLabel(report.stage) }}</span></h1>
          </div>

          <div class="banner info" v-if="report.stage === 'mtd' && reportGrouped">
            {{ monthLabel(report.months[report.months.length - 1]) }} is month to date through {{ dayLabel(report.asOf) }}. Its budget and last year
            are cut to {{ pct(report.fraction * 100) }} of the month, so every column covers the same days.
          </div>
          <div class="banner info" v-else-if="report.stage === 'mtd'">
            Month to date through {{ dayLabel(report.asOf) }}. Budget is shown for {{ pct(report.fraction * 100) }} of the month.
            Only food, beverage and hourly labor are judged now; the rest posts at close.
          </div>
          <div class="banner warn" v-if="report.missing.length">
            <b>{{ report.stage === 'settled' ? 'Missing' : 'Not posted yet' }}:</b>
            <span v-for="(m, i) in report.missing" :key="m.key">{{ i ? ', ' : ' ' }}{{ m.key }} {{ m.name }} (expected about {{ money(m.expected) }})</span>.
            <template v-if="report.headline.ifMissingPosted != null"> If they post, operating income would be about <b>{{ money(report.headline.ifMissingPosted) }}</b>.</template>
          </div>

          <div class="row" style="align-items:stretch">
            <div class="hero" style="flex:1 1 340px">
              <div class="label">Operating income</div>
              <div><span class="value">{{ money(report.headline.operatingIncome) }}</span> <span style="color:#C9CED6">{{ pct(report.headline.operatingIncomePct) }} of sales</span></div>
              <div style="display:flex;flex-wrap:wrap;gap:6px 18px">
                <span v-if="report.headline.budget != null">Budget {{ money(report.headline.budget) }} ({{ pct(report.headline.budgetPct) }}) ·
                  <b :class="report.headline.operatingIncome >= report.headline.budget ? 'good' : 'bad'">{{ signed(report.headline.operatingIncome - report.headline.budget) }}</b></span>
                <span v-if="report.headline.ly != null">{{ lyLabel(report) }} {{ money(report.headline.ly) }} ({{ pct(report.headline.lyPct) }}) ·
                  <b :class="report.headline.operatingIncome >= report.headline.ly ? 'good' : 'bad'">{{ signed(report.headline.operatingIncome - report.headline.ly) }}</b></span>
              </div>
              <div class="warn" v-if="report.headline.ifMissingPosted != null">With the missing lines posted: about {{ money(report.headline.ifMissingPosted) }}.</div>
            </div>
            <div class="grid" style="flex:999 1 560px">
              <div class="card stat" v-for="k in report.kpis" :key="k.label">
                <div class="label">{{ k.label }}</div>
                <div class="value">{{ k.isPct ? pct(k.actual) : money(k.actual) }}</div>
                <div class="sub">Budget {{ k.budget == null ? '—' : (k.isPct ? pct(k.budget) : money(k.budget)) }} · LY {{ k.ly == null ? '—' : (k.isPct ? pct(k.ly) : money(k.ly)) }}</div>
              </div>
            </div>
          </div>

          <div class="card" v-if="!reportGrouped && (report.flags.length || report.stage !== 'mtd')">
            <div class="row" style="margin-bottom:12px">
              <h2>Flags · {{ activeFlags.length }}</h2>
              <span class="muted">Worse than budget by {{ money(rules.minDollar) }} and {{ pct(rules.minPct * 100, 0) }}, or above the normal range (last 12 months as % of sales)</span>
            </div>
            <p v-if="!report.flags.length" class="muted">Nothing flagged this month.</p>
            <div class="grid wide">
              <div v-for="f in report.flags" :key="f.key" :class="['flag-card', { tagged: f.tagged }]">
                <div class="row" style="align-items:baseline">
                  <b>{{ f.key }} {{ f.name }}</b>
                  <span class="bad" style="font-weight:700">{{ money(f.actual) }}</span>
                </div>
                <div style="display:flex;flex-wrap:wrap;gap:6px;align-items:center">
                  <span :class="['badge', f.type]">{{ flagTypeLabel(f.type) }}</span>
                  <span v-if="f.tagged" class="badge timing">Tagged: timing</span>
                  <span class="muted">{{ f.reason }}</span>
                </div>
                <template v-if="f.drivers">
                  <div class="muted">Sub-accounts vs {{ f.drivers.basis }}</div>
                  <div class="driver" v-for="d in f.drivers.lines" :key="d.code">
                    <span>{{ d.code }} {{ d.name }}<br><span class="muted">{{ money(d.actual) }} vs {{ money(d.ref) }}</span></span>
                    <b class="bad">{{ signed(-d.worseBy) }}</b>
                  </div>
                  <div class="driver" v-if="f.drivers.offset">
                    <span>{{ f.drivers.offset.code }} {{ f.drivers.offset.name }} (offset)<br><span class="muted">{{ money(f.drivers.offset.actual) }} vs {{ money(f.drivers.offset.ref) }}</span></span>
                    <b class="good">{{ signed(-f.drivers.offset.worseBy) }}</b>
                  </div>
                </template>
                <div v-if="boot.isAdmin" class="no-print">
                  <button class="small ghost" @click="toggleTiming(f)">{{ f.tagged ? 'Remove timing tag' : 'Tag as timing / accrual' }}</button>
                </div>
              </div>
            </div>
          </div>

          <div class="card flush">
            <div class="head"><h2>Profit &amp; loss</h2>
              <span class="muted"><span class="good"><b>Blue</b></span> = better · <span class="bad"><b>orange</b></span> = worse · ● flagged · ○ missing</span></div>
            <div class="pl-scroll">
              <table :style="{ minWidth: (lineColWidth + (reportGrouped ? 6 : 8) * 100) + 'px' }">
                <thead><tr>
                  <th class="line-col" :style="lineColStyle">Line
                    <span class="col-resize no-print" :class="{ dragging: resizing }" role="separator" aria-orientation="vertical" tabindex="0"
                      :aria-valuenow="lineColWidth" :aria-valuemin="LINE_COL_MIN" :aria-valuemax="LINE_COL_MAX" aria-label="Resize the line column"
                      title="Drag to resize · double-click to reset" @pointerdown="startResize" @dblclick="resetLineCol" @keydown="keyResize"></span></th>
                  <th>Actual</th><th>% sales</th><th>Budget</th><th>vs budget</th><th>{{ lyLabel(report) }}{{ report.lyProrated ? ' (pro-rated)' : '' }}</th><th>vs LY</th>
                  <template v-if="!reportGrouped"><th>3 months vs budget</th><th>Year to date vs budget</th></template></tr></thead>
                <tbody>
                  <template v-for="r in reportRows" :key="r.id">
                    <tr v-if="r.head" class="sec"><td :colspan="reportGrouped ? 7 : 9"><span class="sec-label">{{ r.head }}</span></td></tr>
                    <tr v-else :class="{ total: r.kind === 'sectionTotal' || (r.kind === 'computed' && r.key !== 'OPERATING_INCOME'), key: r.key === 'OPERATING_INCOME' }">
                      <td class="line-col" :style="lineColStyle" :class="{ indent: r.kind === 'line' || r.kind === 'group' }">
                        {{ lineLabel(r) }}<span v-if="r.flag" class="bad"> ●</span><span v-if="r.missing" class="bad"> ○</span>
                      </td>
                      <td>{{ money(r.actual) }}</td>
                      <td class="muted">{{ pct(r.pct) }}<template v-if="r.reportedPct != null && r.section === '5000' && (r.kind === 'line' || r.kind === 'group')"> ({{ pct(r.reportedPct) }})</template></td>
                      <td>{{ r.budget == null ? '—' : money(r.budget) }}</td>
                      <td :class="cls(r.varBudget)">{{ r.varBudget == null ? '—' : signed(r.varBudget) }}</td>
                      <td class="muted">{{ r.ly == null ? '—' : money(r.ly) }}</td>
                      <td :class="cls(r.varLy)">{{ r.varLy == null ? '—' : signed(r.varLy) }}</td>
                      <template v-if="!reportGrouped">
                        <td :class="cls(r.three && r.three.variance)">{{ r.three && r.three.variance != null ? signed(r.three.variance) : '—' }}</td>
                        <td :class="cls(r.ytd && r.ytd.variance)">{{ r.ytd && r.ytd.variance != null ? signed(r.ytd.variance) : '—' }}</td>
                      </template>
                    </tr>
                  </template>
                </tbody>
              </table>
            </div>
            <div class="muted" style="padding:10px 16px" v-if="reportGrouped">% sales = share of net sales.
              Totals add up {{ report.months.length }} month{{ report.months.length === 1 ? '' : 's' }} on file ({{ spanLabel(report.months) }}); budget covers the same months<template v-if="!report.hasBudget"> (not shown: a month has no budget)</template>
              and last year the same months a year earlier<template v-if="!report.hasLastYear"> (not shown: a month is not on file)</template>. Flags and notes are kept per month.</div>
            <div class="muted" style="padding:10px 16px" v-else>% sales = share of net sales. Cost of sales lines also show R365's own % (of that category's sales) in brackets.
              Year to date covers {{ report.ytdMonths.length }} month{{ report.ytdMonths.length === 1 ? '' : 's' }} on file<template v-if="!report.threeMonths">; 3-month figures need the two prior months on file</template>.</div>
          </div>

          <div class="card" v-if="!reportGrouped">
            <h2 style="margin-bottom:8px">Manager notes</h2>
            <template v-if="boot.isAdmin">
              <label for="note" class="muted">Saved with this month and printed with the report</label>
              <textarea id="note" v-model="noteDraft"></textarea>
              <div class="no-print" style="margin-top:8px"><button class="ghost" @click="saveNote" :disabled="noteDraft === report.note">Save note</button></div>
            </template>
            <p v-else>{{ report.note || 'No notes.' }}</p>
          </div>
        </template>
      </template>

      <!-- ============================== TRENDS ============================== -->
      <template v-if="view === 'trends' && periods.length">
        <div class="row">
          <h1>Trends · {{ trendProperty === 'ALL' ? 'All properties' : propertyName(trendProperty) }}</h1>
          <div class="controls">
            <div class="field"><label for="tr-prop">Property</label>
              <select id="tr-prop" v-model="trendProperty" @change="loadTrends">
                <option value="ALL">All properties</option>
                <option v-for="p in activeProperties" :key="p.code" :value="p.code">{{ p.name }}</option>
              </select></div>
            <div class="field"><label for="tr-key">Line</label>
              <select id="tr-key" v-model="trendKey" @change="loadTrends">
                <option v-for="k in TREND_KEYS" :key="k.key" :value="k.key">{{ k.label }}</option>
              </select></div>
            <div class="field"><label for="tr-end">Ending</label>
              <select id="tr-end" v-model="period" @change="loadTrends">
                <option v-for="p in periods" :key="p" :value="p">{{ monthLabel(p) }}</option>
              </select></div>
          </div>
        </div>
        <div v-if="loading.trends" class="muted"><span class="spin"></span>Loading…</div>
        <template v-if="chart && !loading.trends">
          <div class="card">
            <h2 style="margin-bottom:8px">{{ chart.label }} · last 24 months</h2>
            <svg :viewBox="'0 0 ' + chart.w + ' ' + chart.h" :style="{ width: '100%', aspectRatio: chart.w + ' / ' + chart.h, display: 'block' }" role="img" :aria-label="chart.label + ' by month, actual against budget and last year'">
              <g v-for="g in chart.grid" :key="g.y">
                <line :x1="chart.left" :x2="chart.w - 10" :y1="g.y" :y2="g.y" stroke="#EDEDE8"></line>
                <text :x="chart.left - 6" :y="g.y + 4" font-size="11" fill="#5A6069" text-anchor="end">{{ g.label }}</text>
              </g>
              <polyline v-if="chart.ly" :points="chart.ly" fill="none" stroke="#B7BCC3" stroke-width="2"></polyline>
              <polyline v-if="chart.budget" :points="chart.budget" fill="none" stroke="#5A6069" stroke-width="1.5" stroke-dasharray="5 4"></polyline>
              <polyline v-for="(seg, i) in chart.actualSegments" :key="'s' + i" :points="seg" fill="none" stroke="#1F5FAD" stroke-width="2.5"></polyline>
              <g v-for="p in chart.dots" :key="p.period">
                <circle :cx="p.x" :cy="p.y" r="4.5" :fill="p.final ? '#1F5FAD' : '#fff'" stroke="#1F5FAD" stroke-width="2"><title>{{ monthLabel(p.period) }}: {{ chart.isPct ? pct(p.v) : money(p.v) }}{{ p.final ? '' : ' (' + stageLabel(p.stage) + ')' }}</title></circle>
              </g>
              <text v-for="m in chart.xLabels" :key="m.x" :x="m.x" :y="chart.h - 6" font-size="11" fill="#5A6069" text-anchor="middle">{{ m.label }}</text>
            </svg>
            <div class="muted" style="display:flex;flex-wrap:wrap;gap:14px">
              <span><b class="good">●</b> actual (hollow = month to date or preliminary)</span><span>- - budget</span><span style="color:#8A9099">— same month last year</span>
            </div>
          </div>
          <div class="card flush">
            <div class="head"><h2>Last 12 months</h2><span class="muted">Actual, with variance to budget underneath where a budget exists</span></div>
            <div class="scroll">
              <table style="min-width:1000px">
                <thead><tr><th>Line</th><th v-for="p in matrixPeriods" :key="p">{{ monthLabel(p, true) }}</th></tr></thead>
                <tbody>
                  <tr v-for="t in matrix" :key="t.key">
                    <td><b>{{ t.label }}</b></td>
                    <td v-for="c in t.cells" :key="c.period">
                      <template v-if="c.actual == null"><span class="muted">—</span></template>
                      <template v-else>
                        <div :style="{ fontWeight: c.final ? 700 : 400, fontStyle: c.final ? 'normal' : 'italic' }">{{ t.isPct ? pct(c.actual) : money(c.actual / 1000) + 'k' }}</div>
                        <div v-if="c.delta != null" :class="cls(c.delta)" style="font-size:11px">{{ t.isPct ? signedPts(c.delta) : signed(c.delta / 1000) + 'k' }}</div>
                      </template>
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </template>
      </template>

      <!-- ============================== BUDGET REVIEW ============================== -->
      <template v-if="view === 'budget'">
        <div class="row no-print">
          <div class="controls">
            <div class="field"><label for="bv-prop">Property</label>
              <select id="bv-prop" v-model="reviewProperty" @change="reviewYear = null; loadReview()">
                <option v-for="p in budgetProperties" :key="p.code" :value="p.code">{{ p.name }}</option>
              </select></div>
            <div class="field"><label for="bv-year">Budget</label>
              <select id="bv-year" v-model="reviewYear" @change="loadReview">
                <option v-for="b in budgetsFor(reviewProperty)" :key="b.year" :value="b.year">{{ b.year }} · {{ b.status === 'draft' ? 'Draft' : 'Approved' }}</option>
              </select></div>
          </div>
          <div class="controls">
            <button v-if="boot.isAdmin" class="ghost" @click="go('upload')">Upload a new version</button>
            <button class="ghost" @click="printPage" :disabled="!review">Print / save as PDF</button>
          </div>
        </div>
        <div v-if="!budgetProperties.length" class="empty">No budgets on file yet.<template v-if="boot.isAdmin"> Upload one in <button class="link" @click="go('upload')">Upload &amp; settings</button>.</template></div>
        <div v-if="loading.review" class="muted"><span class="spin"></span>Loading…</div>
        <div v-else-if="reviewError" class="banner warn">{{ reviewError }}</div>
        <template v-if="review && !loading.review">
          <div>
            <div class="muted">{{ reviewStatusSentence }}</div>
            <h1>{{ propertyName(review.property) }} · {{ review.year }} budget <span :class="['badge', review.status]">{{ review.status === 'draft' ? 'Draft' : 'Approved' }}</span></h1>
            <div class="muted" style="margin-top:4px">
              Compared with R365 actuals for {{ spanLabel([review.basis.first, review.basis.last]) }}<template v-if="review.basis.covered < 12"> ({{ review.basis.covered }} months on file; budget compared over the same months)</template><template v-if="review.track">
              · last budget: {{ review.track.year }}, {{ spanLabel([review.track.first, review.track.last]) }} on file</template><template v-else> · no {{ review.year - 1 }} budget on file to check the track record</template>.
            </div>
          </div>
          <div v-if="!review.basis.covered" class="banner warn">No months from {{ review.year - 1 }} or {{ review.year - 2 }} are on file for this property, so there is nothing to compare the budget with.</div>

          <div class="row" style="align-items:stretch">
            <div class="hero" style="flex:1 1 340px">
              <div class="label">Budgeted operating income</div>
              <div><span class="value">{{ money(review.headline.budOi) }}</span> <span style="color:#C9CED6">{{ pct(review.headline.budOiPct) }} of sales</span></div>
              <div style="display:flex;flex-wrap:wrap;gap:6px 18px" v-if="review.headline.pyOi != null">
                <span>Last year {{ money(review.headline.pyOi) }} ({{ pct(review.headline.pyOiPct) }}) ·
                  <b :class="review.headline.compOi >= review.headline.pyOi ? 'good' : 'bad'">{{ signed(review.headline.compOi - review.headline.pyOi) }}</b></span>
                <span>Net sales {{ money(review.headline.budNet) }}<template v-if="review.headline.growthPct != null"> ·
                  <b :class="review.headline.growthPct >= 0 ? 'good' : 'bad'">{{ signedPct(review.headline.growthPct) }}</b> on last year</template></span>
              </div>
              <div class="warn" v-if="review.headline.trackOi">{{ review.track.year }} budget so far: operating income {{ money(review.headline.trackOi.actual) }} against {{ money(review.headline.trackOi.budget) }} budgeted
                ({{ signed(review.headline.trackOi.variance) }}); net sales {{ money(review.headline.trackNet.act) }} against {{ money(review.headline.trackNet.bud) }}.</div>
            </div>
            <div class="grid" style="flex:999 1 560px">
              <div class="card stat" v-for="k in review.kpis" :key="k.key">
                <div class="label">{{ k.label }}</div>
                <div class="value">{{ pct(k.budget) }}</div>
                <div class="sub">Last year {{ pct(k.py) }}<template v-if="k.budget != null && k.py != null"> · <b :class="cls(k.py - k.budget)">{{ signedPts(k.budget - k.py) }}</b></template></div>
                <div class="sub" v-if="k.prevBudget != null">{{ review.track.year }} budget {{ pct(k.prevBudget) }}, actual {{ pct(k.prevActual) }}</div>
              </div>
            </div>
          </div>

          <div class="grid wide" style="align-items:start">
            <div class="card">
              <div class="row" style="margin-bottom:10px"><h2>Where the budget pushes · {{ review.pushes.length }}</h2>
                <span class="muted">Costs {{ review.rules.pushPts }} pts of sales or more below last year (worth {{ money(review.rules.minImpact) }}+), and sales growth</span></div>
              <p v-if="!review.pushes.length" class="muted">Nothing is budgeted much better than last year.</p>
              <div class="review-list">
                <div v-for="x in review.pushes" :key="'p' + x.key" class="review-item">
                  <div class="row" style="align-items:baseline;gap:8px">
                    <b v-if="x.kind === 'sales'">Net sales {{ signedPct(x.growthPct) }} on last year</b>
                    <b v-else>{{ lineName(x) }} · {{ pct(x.budgetPct) }} of sales <span class="muted">vs {{ pct(x.pyPct) }} last year</span></b>
                    <b class="good">{{ signed(x.impact) }}</b>
                  </div>
                  <div class="muted" v-if="x.kind === 'sales' && x.months.length">Most of the change: <span v-for="(m, i) in x.months" :key="m.month">{{ i ? ', ' : '' }}{{ monthLabel(m.month, true) }} {{ signed(m.change) }}</span></div>
                  <div class="muted" v-if="x.kind === 'cost'">{{ money(x.impact) }} less than running at last year's rate on the budgeted sales.</div>
                  <div v-if="x.track" class="track">
                    <template v-if="x.kind === 'sales'">{{ review.track.year }} budget assumed {{ signedPct(x.track.assumedPct) }}; {{ x.track.months }} months in, it is {{ signedPct(x.track.deliveredPct) }}.</template>
                    <template v-else>{{ review.track.year }} budget asked for {{ pct(x.track.budgetPct) }}; it ran {{ pct(x.track.actualPct) }}.</template>
                    <span v-if="x.repeat" class="badge preliminary">Missed last year</span>
                  </div>
                </div>
              </div>
              <template v-if="review.room.length">
                <h3 class="sub-head">Room in the budget · {{ review.room.length }}</h3>
                <p class="muted" style="margin:0 0 6px">Budgeted worse than last year. Fine if planned (price increases, new staff); otherwise a cushion.</p>
                <div class="review-list">
                  <div v-for="x in review.room" :key="'r' + x.key" class="review-item">
                    <div class="row" style="align-items:baseline;gap:8px">
                      <b v-if="x.kind === 'sales'">Net sales {{ signedPct(x.growthPct) }} on last year</b>
                      <b v-else>{{ lineName(x) }} · {{ pct(x.budgetPct) }} of sales <span class="muted">vs {{ pct(x.pyPct) }} last year</span></b>
                      <b class="bad">{{ signed(x.impact) }}</b>
                    </div>
                  </div>
                </div>
              </template>
            </div>
            <div class="card">
              <div class="row" style="margin-bottom:10px"><h2>Looks budgeted incorrectly · {{ review.issues.length }}</h2>
                <span class="muted"><span class="badge trend">Likely error</span> <span class="badge spike">Check</span></span></div>
              <p v-if="!review.issues.length" class="muted">Nothing looks out of place.</p>
              <div class="review-list">
                <div v-for="(x, i) in review.issues" :key="'i' + i" class="review-item">
                  <div class="row" style="align-items:baseline;gap:8px">
                    <span><span :class="['badge', x.severity === 'error' ? 'trend' : 'spike']">{{ x.severity === 'error' ? 'Likely error' : 'Check' }}</span>
                      <b> {{ x.key && x.name && x.title.indexOf(x.name) === -1 ? lineName(x) + ': ' : '' }}{{ x.title }}</b></span>
                    <b v-if="x.impact" class="muted" style="font-size:13px">{{ money(x.impact) }}</b>
                  </div>
                  <div class="muted">{{ x.detail }}</div>
                </div>
              </div>
            </div>
          </div>

          <div class="card flush">
            <div class="head"><h2>Budget against last year</h2>
              <span class="muted"><span class="good"><b>▲</b></span> push · <span class="bad"><b>▽</b></span> room · <b class="bad">!</b> see "looks budgeted incorrectly"</span></div>
            <div class="pl-scroll">
              <table :style="{ minWidth: (lineColWidth + 8 * 100) + 'px' }">
                <thead><tr>
                  <th class="line-col" :style="lineColStyle">Line
                    <span class="col-resize no-print" :class="{ dragging: resizing }" role="separator" aria-orientation="vertical" tabindex="0"
                      :aria-valuenow="lineColWidth" :aria-valuemin="LINE_COL_MIN" :aria-valuemax="LINE_COL_MAX" aria-label="Resize the line column"
                      title="Drag to resize · double-click to reset" @pointerdown="startResize" @dblclick="resetLineCol" @keydown="keyResize"></span></th>
                  <th>{{ review.year }} budget</th><th>% sales</th><th>Last year</th><th>% sales</th><th>Change</th><th>Change %</th><th>% sales change</th>
                  <th>{{ review.year - 1 }} budget vs actual</th></tr></thead>
                <tbody>
                  <template v-for="r in reviewRows" :key="r.id">
                    <tr v-if="r.head" class="sec"><td colspan="9"><span class="sec-label">{{ r.head }}</span></td></tr>
                    <tr v-else :class="{ total: r.kind === 'sectionTotal' || (r.kind === 'computed' && r.key !== 'OPERATING_INCOME'), key: r.key === 'OPERATING_INCOME' }">
                      <td class="line-col" :style="lineColStyle" :class="{ indent: r.kind === 'line' || r.kind === 'group' }">
                        {{ lineLabel(r) }}<span v-if="r.mark === 'push'" class="good" title="Pushed: better than last year"> ▲</span><span v-if="r.mark === 'room'" class="bad" title="Room: worse than last year"> ▽</span><b v-if="r.issues" class="bad" title="See looks budgeted incorrectly"> !</b>
                      </td>
                      <td>{{ money(r.budget) }}</td>
                      <td class="muted">{{ pct(r.budgetPct) }}</td>
                      <td class="muted">{{ r.py == null ? '—' : money(r.py) }}</td>
                      <td class="muted">{{ pct(r.pyPct) }}</td>
                      <td :class="cls(r.better)">{{ r.change == null ? '—' : signed(r.change) }}</td>
                      <td :class="cls(r.better)">{{ r.changePct == null ? '—' : signedPct(r.changePct) }}</td>
                      <td :class="r.pts == null || r.key === 'NET_SALES' ? 'muted' : cls(direction(r) * r.pts * 1000)">{{ r.pts == null || r.key === 'NET_SALES' ? '—' : signedPts(r.pts) }}</td>
                      <td :class="cls(r.track && r.track.variance)">{{ r.track ? signed(r.track.variance) : '—' }}</td>
                    </tr>
                  </template>
                </tbody>
              </table>
            </div>
            <div class="muted" style="padding:10px 16px">Change compares the budget with last year over the same {{ review.basis.covered }} calendar months<template v-if="review.basis.covered < 12">; the budget column shows the full year</template>.
              Blue = better for the property. "{{ review.year - 1 }} budget vs actual" covers the months of {{ review.year - 1 }} on file<template v-if="!review.track"> (no {{ review.year - 1 }} budget on file)</template>.</div>
          </div>

          <div class="card flush">
            <div class="head"><h2>Month by month</h2><span class="muted">Each month against the same month last year</span></div>
            <div class="scroll">
              <table style="min-width:860px">
                <thead><tr><th>Month</th><th>Budget net sales</th><th>Last year</th><th>Growth</th><th>Budget OI</th><th>OI %</th><th>Last year OI %</th><th>Prime %</th><th>Last year prime %</th></tr></thead>
                <tbody>
                  <tr v-for="m in review.monthly" :key="m.month">
                    <td><b>{{ monthLabel(m.month, true) }}</b> <span class="muted" v-if="m.basis && m.basis.slice(0, 4) != review.year - 1">vs {{ monthLabel(m.basis, true) }}</span></td>
                    <td>{{ money(m.budNet) }}</td>
                    <td class="muted">{{ m.pyNet == null ? '—' : money(m.pyNet) }}</td>
                    <td :class="cls(m.growthPct)">{{ m.growthPct == null ? '—' : signedPct(m.growthPct) }}</td>
                    <td>{{ money(m.budOi) }}</td>
                    <td>{{ pct(m.budOiPct) }}</td>
                    <td class="muted">{{ pct(m.pyOiPct) }}</td>
                    <td>{{ pct(m.budPrimePct) }}</td>
                    <td class="muted">{{ pct(m.pyPrimePct) }}</td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </template>
      </template>

      <!-- ============================== UPLOAD & SETTINGS ============================== -->
      <template v-if="view === 'upload' && boot.isAdmin">
        <div class="row">
          <h1>Upload &amp; settings</h1>
          <div class="controls">
            <a v-if="boot.spreadsheetUrl" :href="boot.spreadsheetUrl" target="_blank" class="muted">Open data workbook</a>
            <button class="ghost" @click="openSettings">Settings</button>
          </div>
        </div>

        <div class="grid wide" style="align-items:start">
          <!-- P&L upload -->
          <div class="card" style="display:flex;flex-direction:column;gap:12px">
            <h2>P&amp;L from R365</h2>
            <p class="muted" style="margin:0">Monthly <i>Location Side by Side – Period</i> (detailed preferred) or <i>Trailing 12 Periods</i> (or <i>Trailing 12 Periods vs Prior</i>, for 24 months) for one location. Upload weekly for month to date, and again {{ rules.settleDays }} days after month end to settle the month.</p>
            <div class="field"><label for="asof">Data runs through</label><input id="asof" type="date" v-model="pnl.asOf"></div>
            <label class="drop" for="pnl-file">
              <b>Choose a CSV</b><br><span class="muted">{{ pnl.fileName || 'The format is detected automatically' }}</span>
              <input id="pnl-file" type="file" accept=".csv" @change="onPnlFile">

            <div v-if="pnl.stage === 'reading'" class="muted"><span class="spin"></span>Reading the file…</div>
            <div v-if="pnl.stage === 'error'" class="banner warn">{{ pnl.error }}</div>
            <template v-if="pnl.preview && (pnl.stage === 'preview' || pnl.stage === 'saving')">
              <div><span class="badge settled">{{ pnl.preview.formatLabel }}</span> <span class="badge spike">{{ pnl.preview.detailed ? 'Detailed' : 'Simplified' }}</span>
                <span class="muted">{{ pnl.preview.dateRange }}</span></div>
              <ul class="checks">
                <li><b :class="pnl.preview.problems ? 'bad' : 'good'">{{ pnl.preview.problems ? '✕' : '✓' }}</b>
                  <span v-if="!pnl.preview.problems">Every total adds up.</span>
                  <span v-else>{{ pnl.preview.problems }} totals do not add up — this file cannot be saved.</span></li>
                <li><b class="good">✓</b><span>{{ pnl.preview.months.length }} month × property combinations · {{ pnl.preview.summaryRows }} category lines<template v-if="pnl.preview.detailed"> · {{ pnl.preview.detailRows }} sub-accounts</template></span></li>
                <li v-for="p in pnl.preview.properties.filter(x => x.isNew)" :key="p.code"><b class="good">+</b><span>New property: {{ p.name }} ({{ p.code }})</span></li>

              <div class="scroll"><table>
                <thead><tr><th>Property</th><th style="text-align:left">Months</th></tr></thead>
                <tbody><tr v-for="g in previewByProperty" :key="g.code"><td>{{ g.name }}</td>

              </table></div>
