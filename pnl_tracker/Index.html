                <b>Replaces {{ pnl.preview.replaces.length }} month{{ pnl.preview.replaces.length === 1 ? '' : 's' }} already on file.</b>
                <div v-for="r in pnl.preview.replaces.filter(x => x.changeCount || x.stageBefore !== x.stageAfter)" :key="r.property + r.period" style="margin-top:4px">
                  {{ propertyName(r.property) }} {{ monthLabel(r.period) }}: {{ stageLabel(r.stageBefore) }} → {{ stageLabel(r.stageAfter) }}<template v-if="r.changeCount">,
                    {{ r.changeCount }} line{{ r.changeCount === 1 ? '' : 's' }} changed ({{ r.changes.slice(0, 3).map(c => c.name + ' ' + signed(c.after - c.before)).join(', ') }}{{ r.changeCount > 3 ? '…' : '' }})</template>
                  <b v-if="stageRank(r.stageAfter) < stageRank(r.stageBefore)" class="bad"> — older than what is on file</b>
                </div>
              </div>
              <div v-if="pnl.preview.copies && pnl.preview.copies.length" class="banner warn">
                <b>This file cannot be saved: its figures match another property to the dollar.</b>
                <div v-for="c in pnl.preview.copies" :key="c.property + c.other">{{ propertyName(c.property) }}: {{ c.periods.length }} month{{ c.periods.length === 1 ? '' : 's' }} ({{ c.periods.map(p => monthLabel(p, true)).join(', ') }}) identical to {{ propertyName(c.other) }}.</div>
                Check that the report was run for the right location in R365.
              </div>
              <div v-if="pnl.preview.missing.length" class="banner warn">
                <b>Recurring lines with nothing posted:</b>
                <span v-for="(m, i) in pnl.preview.missing" :key="m.property + m.key">{{ i ? '; ' : ' ' }}{{ propertyName(m.property) }} {{ m.key }} {{ m.name }}</span>.
                The month is saved as {{ stageLabel(pnl.preview.months[pnl.preview.months.length - 1].stage).toLowerCase() }} and shows these as not posted yet.
              </div>
              <div class="controls">
                <button @click="commitPnl" :disabled="pnl.stage === 'saving' || pnl.preview.problems > 0 || (pnl.preview.copies && pnl.preview.copies.length > 0)">{{ pnl.stage === 'saving' ? 'Saving…' : 'Save' }}</button>
                <button class="ghost" @click="resetPnl" :disabled="pnl.stage === 'saving'">Cancel</button>
              </div>
            </template>
          </div>

          <!-- Budget upload -->
          <div class="card" style="display:flex;flex-direction:column;gap:12px">
            <h2>Budget</h2>
            <p class="muted" style="margin:0">The annual budget template: upload its .xlsx, or enter the Google Sheet ID. The 12 MONTH tab and the daily JAN–DEC tabs are read.</p>
            <div class="controls">
              <button :class="budget.mode === 'xlsx' ? '' : 'ghost'" class="small" @click="budget.mode = 'xlsx'">Upload .xlsx</button>
              <button :class="budget.mode === 'sheet' ? '' : 'ghost'" class="small" @click="budget.mode = 'sheet'">Google Sheet ID</button>
            </div>
            <label v-if="budget.mode === 'xlsx'" class="drop" for="budget-file">
              <b>Choose the budget .xlsx</b><br><span class="muted">{{ budget.fileName || 'e.g. THE_BYGONE_Budget_v2026.xlsx' }}</span>
              <input id="budget-file" type="file" accept=".xlsx" @change="onBudgetFile">
            </label>
            <div v-else class="controls">
              <div class="field" style="flex:1"><label for="sheet-id">Google Sheet ID or link</label><input id="sheet-id" type="text" v-model="budget.sheetId" placeholder="1aBc…"></div>
              <button @click="previewBudget" :disabled="!budget.sheetId || budget.stage === 'reading'">Read</button>
            </div>
            <div v-if="budget.stage === 'reading'" class="muted"><span class="spin"></span>Reading the budget{{ budget.mode === 'xlsx' ? ' (converting the .xlsx takes a few seconds)' : '' }}…</div>
            <div v-if="budget.stage === 'error'" class="banner warn">{{ budget.error }}</div>
            <template v-if="budget.preview && (budget.stage === 'preview' || budget.stage === 'saving')">
              <div class="muted">{{ budget.preview.source }} · name cell “{{ budget.preview.nameCell }}” · {{ budget.preview.glRows }} GL rows · {{ budget.preview.dailyDays }} days of daily sales</div>
              <ul class="checks">
                <li v-for="c in budget.preview.checks" :key="c.label"><b :class="c.ok ? 'good' : 'bad'">{{ c.ok ? '✓' : '!' }}</b><span>{{ c.label }}. <span class="muted">{{ c.detail }}</span></span></li>
              </ul>
              <div class="controls">
                <div class="field"><label for="bud-prop">Property</label>
                  <select id="bud-prop" v-model="budget.property">
                    <option value="" disabled>Choose…</option>
                    <option v-for="p in boot.properties" :key="p.code" :value="p.code">{{ p.name }}</option>
                  </select></div>
                <div class="field"><label for="bud-year">Year</label><input id="bud-year" type="number" v-model.number="budget.year" style="width:100px"></div>
              </div>
              <div class="scroll"><table>
                <thead><tr><th>Line</th><th>Annual</th><th>{{ monthLabel(budget.year + '-01', true) }}</th><th>{{ monthLabel(budget.year + '-12', true) }}</th></tr></thead>
                <tbody>
                  <tr v-for="l in budget.preview.lines" :key="l.key"><td>{{ l.key }} <span class="muted">{{ l.label }}</span></td><td>{{ money(l.total) }}</td><td>{{ money(l.months[0]) }}</td><td>{{ money(l.months[11]) }}</td></tr>
                  <tr class="key"><td>Operating income</td><td>{{ money(budget.preview.operatingIncome.reduce((s, v) => s + v, 0)) }}</td><td>{{ money(budget.preview.operatingIncome[0]) }}</td><td>{{ money(budget.preview.operatingIncome[11]) }}</td></tr>
                </tbody>
              </table></div>
              <div v-if="hasBudget(budget.property, budget.year)" class="banner info">This replaces the {{ budget.year }} budget on file for {{ propertyName(budget.property) }}.</div>
              <div v-if="budget.year && String(boot.today || '') < budget.year + '-01-01'" class="banner info">Saved as a <b>draft</b>: it counts as approved from Jan 1, {{ budget.year }}. You can upload a new version at any time; it replaces this one.</div>
              <div class="controls">
                <button @click="commitBudget" :disabled="!budget.property || !budget.year || budget.stage === 'saving'">{{ budget.stage === 'saving' ? 'Saving…' : 'Save budget' }}</button>
                <button class="ghost" @click="resetBudget">Cancel</button>
              </div>
            </template>
          </div>
        </div>

        <div class="card flush">
          <div class="head"><h2>On file</h2>
            <span class="muted"><span class="badge settled">Settled</span> <span class="badge preliminary">Preliminary</span> <span class="badge mtd">Month to date</span> · select a month to remove it</span></div>
          <div class="scroll">
            <table style="min-width:900px">
              <thead><tr><th>Property</th><th style="text-align:left">Budgets</th><th v-for="p in fileGridPeriods" :key="p">{{ monthLabel(p, true) }}</th></tr></thead>
              <tbody>
                <tr v-for="p in boot.properties" :key="p.code">
                  <td><b>{{ p.name }}</b> <span class="muted">{{ p.code }}</span></td>
                  <td style="text-align:left"><span v-for="b in budgetsFor(p.code)" :key="b.year" style="margin-right:6px;white-space:nowrap">
                    <button class="link small" @click="openReview(p.code, b.year)" :title="'Review the ' + b.year + ' budget'">{{ b.year }}</button><span v-if="b.status === 'draft'" class="muted"> draft</span>
                    <button class="link small" @click="removeBudget(p.code, b.year)" :aria-label="'Remove ' + b.year + ' budget'">×</button></span>
                    <span v-if="!budgetsFor(p.code).length" class="muted">none</span></td>
                  <td v-for="per in fileGridPeriods" :key="per" style="padding:4px">
                    <button v-if="monthStage(p.code, per)" :class="['chip', monthStage(p.code, per)]" style="width:100%;min-height:26px"
                      @click="removeMonth(p.code, per)" :title="stageLabel(monthStage(p.code, per)) + ' — select to remove'">{{ monthStage(p.code, per) === 'settled' ? '✓' : (monthStage(p.code, per) === 'mtd' ? 'MTD' : 'P') }}</button>
                    <div v-else class="chip">·</div>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </template>
    </main>

    <!-- ============================== SETTINGS ============================== -->
    <div class="overlay" v-if="settings.open" @click.self="settings.open = false">
      <div class="modal" role="dialog" aria-modal="true" aria-label="Settings">
        <h2>Settings</h2>
        <div v-if="settings.error" class="banner warn">{{ settings.error }}</div>
        <template v-if="settings.draft">
          <section>
            <h3 style="margin:0 0 6px;font-size:14px">Viewers</h3>
            <p class="muted" style="margin:0 0 6px">Accounts that can see every report, read-only. Administrators are the global admin list.</p>
            <ul class="chip-list"><li v-for="e in settings.draft.viewers" :key="e">{{ e }}<button @click="settings.draft.viewers = settings.draft.viewers.filter(x => x !== e)" :aria-label="'Remove ' + e">×</button></li></ul>
            <div class="controls" style="margin-top:6px"><input type="email" v-model="settings.newViewer" placeholder="name@company.com" style="flex:1" @keydown.enter.prevent="addViewer"><button class="ghost" @click="addViewer">Add</button></div>
          </section>
          <section>
            <h3 style="margin:0 0 6px;font-size:14px">Properties</h3>
            <table><thead><tr><th>Code</th><th style="text-align:left">Name</th><th>Show</th></tr></thead>
              <tbody><tr v-for="p in settings.draft.properties" :key="p.code"><td>{{ p.code }}</td>
                <td style="text-align:left"><input type="text" v-model="p.name" :aria-label="'Name for ' + p.code" style="width:100%"></td>
                <td><input type="checkbox" v-model="p.active" :aria-label="'Show ' + p.code"></td></tr></tbody></table>
          </section>
          <section>
            <h3 style="margin:0 0 6px;font-size:14px">Flag rule</h3>
            <div class="grid">
              <div class="field"><label for="r1">Over budget by at least ($)</label><input id="r1" type="number" v-model.number="settings.draft.rules.minDollar"></div>
              <div class="field"><label for="r2">… and at least (% of budget)</label><input id="r2" type="number" step="1" v-model.number="settings.minPctWhole"></div>
              <div class="field"><label for="r3">Sub-account call-out at least ($)</label><input id="r3" type="number" v-model.number="settings.draft.rules.driverMin"></div>
              <div class="field"><label for="r4">Month to date: pts of sales over budget</label><input id="r4" type="number" step="0.1" v-model.number="settings.draft.rules.mtdPctPoints"></div>
              <div class="field"><label for="r5">Days after month end to settle</label><input id="r5" type="number" v-model.number="settings.draft.rules.settleDays"></div>
            </div>
          </section>
          <section v-if="settings.globalAdmins">
            <h3 style="margin:0 0 6px;font-size:14px">Global admins</h3>
            <ul class="chip-list"><li v-for="e in settings.globalAdmins" :key="e">{{ e }}<button @click="removeGlobalAdmin(e)" :aria-label="'Remove ' + e">×</button></li></ul>
            <div class="controls" style="margin-top:6px"><input type="email" v-model="settings.newAdmin" placeholder="name@company.com" style="flex:1"><button class="ghost" @click="addGlobalAdmin">Add</button>
              <button class="ghost" @click="saveGlobalAdmins">Save admins</button></div>
          </section>
        </template>
        <div class="controls" style="justify-content:flex-end">
          <button class="ghost" @click="settings.open = false">Cancel</button>
          <button @click="saveSettings" :disabled="!settings.draft">Save settings</button>
        </div>
      </div>
    </div>
  </template>
</div>

<script src="https://cdn.jsdelivr.net/npm/vue@3.4.31/dist/vue.global.prod.js"></script>
<script>
  const VIEWS = [
    { key: 'portfolio', label: 'Portfolio' },
    { key: 'report', label: 'Period report' },
    { key: 'trends', label: 'Trends' },
    { key: 'budget', label: 'Budget review' },
    { key: 'upload', label: 'Upload & settings', admin: true }
  ];
  const TREND_KEYS = [
    { key: 'OI_PCT', label: 'Operating income %' }, { key: 'OPERATING_INCOME', label: 'Operating income ($)' },
    { key: 'NET_SALES', label: 'Net sales' }, { key: 'PRIME_PCT', label: 'Prime cost %' },
    { key: 'COS_PCT', label: 'Cost of sales %' }, { key: 'LABOR_PCT', label: 'Labor %' },
    { key: 'EXP_PCT', label: 'Expenses (7000) %' },
    { key: '5002', label: '5002 Food Cost' }, { key: '5185', label: '5185 Beer, Wine & Liquor' },
    { key: '6110', label: '6110 Management' }, { key: '6201', label: '6201 FOH Hourly' }, { key: '6209', label: '6209 BOH Hourly' },
    { key: '6275', label: '6275 Payroll Related' }, { key: '7005', label: '7005 Direct Operating' },
    { key: '7202', label: '7202 Music & Entertainment' }, { key: '7300', label: '7300 Marketing' },
    { key: '7400', label: '7400 Utilities' }, { key: '7500', label: '7500 General & Admin' },
    { key: '7590', label: '7590 Repairs & Maintenance' }, { key: '9100', label: '9100 Management Fee' },
    { key: '8100', label: '8100 Occupancy' }
  ];
  const MATRIX_KEYS = ['NET_SALES', 'OPERATING_INCOME', 'OI_PCT', 'PRIME_PCT', 'LABOR_PCT', 'EXP_PCT'];
  const HIGHER_BETTER = { NET_SALES: 1, OPERATING_INCOME: 1, OI_PCT: 1 };
  const SECTION_NAMES = { '4000': 'Sales', '5000': 'Cost of sales', '6000': 'Labor', '7000': 'Expenses',
    '8000': 'Non-controllable', '9000': 'Below operating income' };
  const GROUPINGS = [{ key: 'month', label: 'Month' }, { key: 'quarter', label: 'Quarter' }, { key: 'ytd', label: 'Year to date' }];
  const LINE_COL_MIN = 120, LINE_COL_MAX = 560, LINE_COL_KEY = 'pnl.lineColWidth';
  const defaultLineCol = () => Math.round(Math.min(280, Math.max(LINE_COL_MIN, window.innerWidth * 0.4)));
  const storedLineCol = () => {
    try { const v = Number(localStorage.getItem(LINE_COL_KEY)); if (v >= LINE_COL_MIN && v <= LINE_COL_MAX) return v; } catch (e) { /* storage blocked */ }
    return defaultLineCol();
  };
  const quarterOf = p => Math.floor((+p.slice(5, 7) - 1) / 3) + 1;
  const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

  const gas = (fn, ...args) => new Promise((resolve, reject) => {
    google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[fn](...args);
  });
  const today = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
  const addMonths = (p, n) => { const y = +p.slice(0, 4), m = +p.slice(5, 7) - 1 + n; const yy = y + Math.floor(m / 12), mm = ((m % 12) + 12) % 12 + 1; return yy + '-' + String(mm).padStart(2, '0'); };

  Vue.createApp({
    data() {
      return {
        VIEWS, TREND_KEYS, GROUPINGS, LINE_COL_MIN, LINE_COL_MAX,
        review: null, reviewError: '', reviewProperty: null, reviewYear: null,
        grouping: 'month', lineColWidth: storedLineCol(), resizing: false,
        bootLoading: true, boot: { configured: true, role: null, properties: [], months: {}, budgets: [] },
        view: 'portfolio', period: null, property: null,
        portfolio: null, report: null, reportError: '', trends: null, noteDraft: '',
        trendProperty: 'ALL', trendKey: 'OI_PCT',
        loading: { portfolio: false, report: false, trends: false, review: false },
        toasts: [], toastSeq: 0,
        pnl: { stage: null, fileName: '', text: null, asOf: today(), preview: null, error: '' },
        budget: { stage: null, mode: 'xlsx', fileName: '', base64: null, sheetId: '', year: null, property: '', preview: null, error: '' },
        settings: { open: false, draft: null, error: '', newViewer: '', newAdmin: '', globalAdmins: null, minPctWhole: 10 }
      };
    },
    computed: {
      budgetProperties() {
        const has = {}; (this.boot.budgets || []).forEach(b => { has[b.property] = true; });
        return (this.boot.properties || []).filter(p => has[p.code]);
      },
      reviewRows() {
        if (!this.review) return [];
        const out = []; let sec = null;
        this.review.rows.forEach((r, i) => {
          if (r.section !== sec) { sec = r.section; out.push({ id: 'h' + i, head: SECTION_NAMES[sec] || sec }); }
          out.push(Object.assign({ id: r.key }, r));
        });
        return out;
      },
      reviewStatusSentence() {
        const r = this.review; if (!r) return '';
        const up = r.upload && r.upload.at ? ' · uploaded ' + this.dayLabel(r.upload.at.slice(0, 10)) + ', ' + r.upload.at.slice(0, 4) + (r.upload.by ? ' by ' + r.upload.by : '') + (r.upload.file ? ' (' + r.upload.file + ')' : '') : '';
        return (r.status === 'draft' ? 'Draft · counts as approved from Jan 1, ' + r.year + '; a new version can be uploaded any time' : 'Approved (the year has started)') + up;
      },
      groupingNoun() { return { month: 'Month', quarter: 'Quarter', ytd: 'Through' }[this.grouping]; },
      priorLabel() { return { month: 'Prior month', quarter: 'Prior quarter', ytd: 'Last year YTD' }[this.grouping]; },
      reportGrouped() { return !!this.report && !!this.report.grouping && this.report.grouping !== 'month'; },
      lineColStyle() { const w = this.lineColWidth + 'px'; return { width: w, minWidth: w, maxWidth: w }; },
      rules() { return this.boot.rules || { minDollar: 2500, minPct: 0.1, settleDays: 15 }; },
      visibleViews() { return VIEWS.filter(v => !v.admin || this.boot.isAdmin); },
      activeProperties() { return (this.boot.properties || []).filter(p => p.active !== false); },
      periods() {
        const set = {};
        Object.keys(this.boot.months || {}).forEach(c => this.boot.months[c].forEach(m => { set[m.period] = true; }));
        return Object.keys(set).sort().reverse();
      },
      portfolioStage() {
        if (!this.portfolio) return null;
        const st = this.portfolio.rows.filter(r => r.onFile).map(r => r.stage);
        return st.indexOf('mtd') !== -1 ? 'mtd' : (st.indexOf('preliminary') !== -1 ? 'preliminary' : (st.length ? 'settled' : null));
      },
      portfolioMissing() { return this.portfolio ? this.portfolio.rows.filter(r => r.missing).length : 0; },
      portfolioFlags() { return this.portfolio ? this.portfolio.rows.reduce((s, r) => s + (r.flags || 0), 0) : 0; },
      activeFlags() { return this.report ? this.report.flags.filter(f => !f.tagged) : []; },
      reportRows() {
        if (!this.report) return [];
        const out = []; let sec = null;
        this.report.rows.forEach((r, i) => {
          if (r.section !== sec) { sec = r.section; out.push({ id: 'h' + i, head: SECTION_NAMES[sec] || sec }); }
          out.push(Object.assign({ id: r.key }, r));
        });
        return out;
      },
      previewByProperty() {
        if (!this.pnl.preview) return [];
        const by = {};
        this.pnl.preview.months.forEach(m => { (by[m.property] = by[m.property] || { code: m.property, name: m.propertyName, months: [] }).months.push(m); });
        return Object.values(by);
      },
      fileGridPeriods() {
        const latest = this.periods[0] || addMonths(today().slice(0, 7), 0);
        const out = []; for (let i = 23; i >= 0; i--) out.push(addMonths(latest, -i)); return out;
      },
      chart() {
        if (!this.trends || !this.trends.length) return null;
        const t = this.trends[0];
        const w = 900, h = 260, left = 56, top = 14, bottom = 28;
        const vals = [];
        t.points.forEach(p => { [p.actual, p.budget, p.ly].forEach(v => { if (v != null) vals.push(v); }); });
        if (!vals.length) return null;
        let lo = Math.min.apply(null, vals), hi = Math.max.apply(null, vals);
        if (t.isPct) { lo = Math.min(lo, 0); }
        if (hi === lo) { hi += 1; lo -= 1; }
        const pad = (hi - lo) * 0.08; lo -= pad; hi += pad;
        const n = t.points.length;
        const X = i => left + i * (w - left - 20) / (n - 1);
        const Y = v => top + (hi - v) / (hi - lo) * (h - top - bottom);
        const line = key => { const pts = t.points.map((p, i) => p[key] == null ? null : X(i) + ',' + Y(p[key])).filter(Boolean); return pts.length > 1 ? pts.join(' ') : null; };
        const segs = []; let cur = [];
        t.points.forEach((p, i) => { if (p.actual == null) { if (cur.length > 1) segs.push(cur.join(' ')); cur = []; } else cur.push(X(i) + ',' + Y(p.actual)); });
        if (cur.length > 1) segs.push(cur.join(' '));
        const grid = []; for (let g = 0; g <= 4; g++) { const v = lo + (hi - lo) * g / 4; grid.push({ y: Y(v), label: t.isPct ? v.toFixed(0) + '%' : this.compact(v) }); }
        return {
          w, h, left, label: t.label, isPct: t.isPct, grid,
          budget: line('budget'), ly: line('ly'), actualSegments: segs,
          dots: t.points.map((p, i) => p.actual == null ? null : { period: p.period, x: X(i), y: Y(p.actual), v: p.actual, stage: p.stage, final: p.stage === 'settled' }).filter(Boolean),
          xLabels: t.points.map((p, i) => ({ x: X(i), label: i % 3 === 0 || i === n - 1 ? this.monthLabel(p.period, true) : '' }))
        };
      },
      matrixPeriods() { if (!this.trends) return []; return this.trends[1] ? this.trends[1].points.slice(-12).map(p => p.period) : []; },
      matrix() {
        if (!this.trends) return [];
        return this.trends.slice(1).map(t => ({
          key: t.key, label: t.label, isPct: t.isPct,
          cells: t.points.slice(-12).map(p => ({ period: p.period, actual: p.actual, final: p.stage === 'settled',
            delta: p.actual == null || p.budget == null ? null : (HIGHER_BETTER[t.key] ? 1 : -1) * (p.actual - p.budget) }))
        }));
      }
    },
    mounted() { this.loadBoot(true); },
    methods: {
      /* ---------- formatting ---------- */
      money(v) { if (v == null || isNaN(v)) return '—'; const n = Math.round(v); return (n < 0 ? '−' : '') + Math.abs(n).toLocaleString('en-US'); },
      signed(v) { if (v == null || isNaN(v)) return '—'; const n = Math.round(v); return (n > 0 ? '+' : n < 0 ? '−' : '') + Math.abs(n).toLocaleString('en-US'); },
      signedPts(v) { if (v == null) return '—'; return (v >= 0 ? '+' : '−') + Math.abs(v).toFixed(1) + ' pts'; },
      pct(v, d) { if (v == null || isNaN(v)) return '—'; return v.toFixed(d == null ? 1 : d) + '%'; },
      compact(v) { const a = Math.abs(v); return (v < 0 ? '−' : '') + (a >= 1e6 ? (a / 1e6).toFixed(1) + 'M' : a >= 1e3 ? Math.round(a / 1e3) + 'k' : Math.round(a)); },
      cls(v) { if (v == null || Math.abs(v) < 0.5) return 'muted'; return v > 0 ? 'good' : 'bad'; },
      monthLabel(p, short) { if (!p) return ''; const m = MONTHS[+p.slice(5, 7) - 1]; return short ? m + ' ' + p.slice(2, 4) : m + ' ' + p.slice(0, 4); },
      dayLabel(d) { if (!d) return ''; return MONTHS[+d.slice(5, 7) - 1] + ' ' + (+d.slice(8, 10)); },
      stageLabel(s) { return { mtd: 'Month to date', preliminary: 'Preliminary', settled: 'Settled' }[s] || ''; },
      stageRank(s) { return { mtd: 0, preliminary: 1, settled: 2 }[s] || 0; },
      flagTypeLabel(t) { return { trend: 'Trend', spike: 'Spike', new: 'New', pace: 'Running high' }[t] || t; },
      barWidth(v) { const max = Math.max(40, ...this.portfolio.rows.filter(r => r.onFile).map(r => r.oiPct || 0)); return Math.max(0, Math.min(100, (v || 0) / max * 100)) + '%'; },
      groupKey(p, grouping) { return grouping === 'quarter' ? p.slice(0, 4) + 'Q' + quarterOf(p) : p; },
      groupLabel(p, grouping) {
        if (!p) return '';
        if (grouping === 'quarter') return 'Q' + quarterOf(p) + ' ' + p.slice(0, 4);
        if (grouping === 'ytd') return 'Year to date · ' + (p.slice(5, 7) === '01' ? 'Jan' : 'Jan–' + MONTHS[+p.slice(5, 7) - 1]) + ' ' + p.slice(0, 4);
        return this.monthLabel(p);
      },
      spanLabel(months) {
        if (!months || !months.length) return '';
        const a = months[0], b = months[months.length - 1];
        if (a === b) return this.monthLabel(a);
        return a.slice(0, 4) === b.slice(0, 4) ? MONTHS[+a.slice(5, 7) - 1] + '–' + this.monthLabel(b) : this.monthLabel(a) + ' – ' + this.monthLabel(b);
      },
      lyLabel(r) {
        if (!r.hasLastYear) return 'Last year';
        return r.grouping && r.grouping !== 'month' ? 'Last year' : this.monthLabel(r.lyPeriod);
      },
      /** Choices for the period dropdown. A quarter's value is its latest month on file. */
      periodOptions(list) {
        if (this.grouping === 'month') return list.map(p => ({ value: p, label: this.monthLabel(p) }));
        if (this.grouping === 'ytd') return list.map(p => ({ value: p, label: this.monthLabel(p) }));
        const seen = {}, out = [];
        list.forEach(p => {
          const k = this.groupKey(p, 'quarter'); if (seen[k]) return; seen[k] = true;
          const done = +p.slice(5, 7) % 3 === 0;
          out.push({ value: p, label: this.groupLabel(p, 'quarter') + (done ? '' : ' (through ' + MONTHS[+p.slice(5, 7) - 1] + ')') });
        });
        return out;
      },
      /** Keep the chosen period valid for the current grouping, staying in the same quarter where possible. */
      snapPeriod(list) {
        const opts = this.periodOptions(list);
        if (!opts.length || opts.some(o => o.value === this.period)) return;
        const k = this.period ? this.groupKey(this.period, this.grouping) : null;
        const same = opts.filter(o => this.groupKey(o.value, this.grouping) === k)[0];
        this.period = (same || opts[0]).value;
      },
      setGrouping() {
        if (this.view === 'report') this.loadReport(); else this.loadPortfolio();
      },

      /* ---------- line column resize ---------- */
      setLineCol(w) {
        this.lineColWidth = Math.round(Math.max(LINE_COL_MIN, Math.min(LINE_COL_MAX, w)));
        try { localStorage.setItem(LINE_COL_KEY, String(this.lineColWidth)); } catch (e) { /* storage blocked */ }
      },
      startResize(e) {
        e.preventDefault();
        const handle = e.currentTarget, startX = e.clientX, startW = this.lineColWidth;
        handle.setPointerCapture(e.pointerId);
        this.resizing = true; document.body.classList.add('resizing');
        const move = ev => this.setLineCol(startW + ev.clientX - startX);
        const up = () => {
          this.resizing = false; document.body.classList.remove('resizing');
          handle.removeEventListener('pointermove', move); handle.removeEventListener('pointerup', up); handle.removeEventListener('pointercancel', up);
        };
        handle.addEventListener('pointermove', move); handle.addEventListener('pointerup', up); handle.addEventListener('pointercancel', up);
      },
      keyResize(e) {
        const step = e.shiftKey ? 48 : 16;
        if (e.key === 'ArrowLeft') { e.preventDefault(); this.setLineCol(this.lineColWidth - step); }
        if (e.key === 'ArrowRight') { e.preventDefault(); this.setLineCol(this.lineColWidth + step); }
        if (e.key === 'Home') { e.preventDefault(); this.resetLineCol(); }
      },
      resetLineCol() {
        this.lineColWidth = defaultLineCol();
        try { localStorage.removeItem(LINE_COL_KEY); } catch (e) { /* storage blocked */ }
      },
      signedPct(v) { if (v == null || isNaN(v)) return '—'; return (v >= 0 ? '+' : '−') + Math.abs(v).toFixed(1) + '%'; },
      lineName(x) { return (/^\d/.test(x.key) ? x.key + ' ' : '') + x.name; },
      direction(r) { return r.section === '4000' || HIGHER_BETTER[r.key] || ['GROSS_PROFIT', 'PROFIT_AFTER_PRIME_COST', 'CONTROLLABLE_PROFIT', 'NET_PROFIT'].indexOf(r.key) !== -1 ? 1 : -1; },
      lineLabel(r) { return (/^\d/.test(r.key) ? r.key + ' ' : '') + r.name; },
      propertyName(code) { const p = (this.boot.properties || []).filter(x => x.code === code)[0]; return p ? p.name : code; },
      stageSentence(r) {
        if (r.grouping && r.grouping !== 'month') {
          const parts = [r.months.length + ' of ' + r.expectedMonths + ' months on file (' + this.spanLabel(r.months) + ')',
            'data through ' + this.dayLabel(r.asOf)];
          if (r.stage !== 'settled') parts.push(r.stage === 'mtd' ? 'latest month is month to date' : 'includes a preliminary month');
          return parts.join(' · ');
        }
        if (r.stage === 'mtd') return 'Month to date · data through ' + this.dayLabel(r.asOf);
        const end = r.period + '-' + String(new Date(+r.period.slice(0, 4), +r.period.slice(5, 7), 0).getDate()).padStart(2, '0');
        if (r.stage === 'preliminary') {
          const d = new Date(end + 'T12:00:00'); d.setDate(d.getDate() + this.rules.settleDays);
          return 'Preliminary · data through ' + this.dayLabel(r.asOf) + ' · upload again on or after ' + MONTHS[d.getMonth()] + ' ' + d.getDate() + ' to settle';
        }
        return 'Settled · data through ' + this.dayLabel(r.asOf);
      },
      periodsFor(code) { return ((this.boot.months || {})[code] || []).map(m => m.period).sort().reverse(); },
      monthStage(code, period) { const m = ((this.boot.months || {})[code] || []).filter(x => x.period === period)[0]; return m ? m.stage : null; },
      budgetsFor(code) { return (this.boot.budgets || []).filter(b => b.property === code).sort((a, b) => b.year - a.year); },
      hasBudget(code, year) { return (this.boot.budgets || []).some(b => b.property === code && b.year === Number(year)); },

      /* ---------- toasts ---------- */
      toast(msg, type) {
        this.toasts = this.toasts.filter(t => t.type !== 'loading');
        const id = ++this.toastSeq; this.toasts.push({ id, msg, type });
        if (type === 'success') setTimeout(() => this.dismissToast(id), 3000);
      },
      dismissToast(id) { this.toasts = this.toasts.filter(t => t.id !== id); },

      /* ---------- navigation ---------- */
      async loadBoot(first) {
        try {
          this.boot = await gas('getBootstrap');
        } catch (err) {
          this.boot = { configured: true, role: null, error: err.message };
          this.toast(err.message, 'error');
        }
        this.bootLoading = false;
        if (!this.boot.role) return;
        if (first) {
          google.script.url.getLocation(loc => {
            const q = (loc && loc.parameter) || {};
            this.period = q.period || this.boot.latestPeriod;
            if (GROUPINGS.some(gr => gr.key === q.grouping)) this.grouping = q.grouping;
            this.property = q.property || (this.activeProperties[0] && this.activeProperties[0].code);
            this.go(q.view || (this.periods.length ? 'portfolio' : (this.boot.isAdmin ? 'upload' : 'portfolio')));
          });
        } else if (!this.period) {
          this.period = this.boot.latestPeriod;
        }
      },
      go(view) {
        this.view = view;
        if (view === 'portfolio') this.loadPortfolio();
        if (view === 'report') this.loadReport();
        if (view === 'trends') this.loadTrends();
        if (view === 'budget') this.loadReview();
      },
      openReview(code, year) { this.reviewProperty = code; this.reviewYear = year; this.go('budget'); },
      async loadReview() {
        const props = this.budgetProperties;
        if (!props.length) { this.review = null; return; }
        if (!props.some(p => p.code === this.reviewProperty)) {
          this.reviewProperty = (props.filter(p => p.code === this.property)[0] || props[0]).code;
          this.reviewYear = null;
        }
        const years = this.budgetsFor(this.reviewProperty).map(b => b.year);
        if (years.indexOf(Number(this.reviewYear)) === -1) this.reviewYear = years[0];
        this.loading.review = true; this.reviewError = '';
        try { this.review = await gas('getBudgetReview', this.reviewProperty, this.reviewYear); }
        catch (err) { this.review = null; this.reviewError = err.message; }
        this.loading.review = false;
      },
      openReport(code, period) { this.property = code; this.period = period; this.go('report'); },
      async loadPortfolio() {
        if (!this.period) return;
        this.snapPeriod(this.periods);
        this.loading.portfolio = true;
        try { this.portfolio = await gas('getPortfolio', this.period, this.grouping); }
        catch (err) { this.toast(err.message, 'error'); }
        this.loading.portfolio = false;
      },
      async loadReport() {
        if (!this.property) return;
        const list = this.periodsFor(this.property);
        if (!list.length) { this.report = null; this.reportError = 'No months on file for ' + this.propertyName(this.property) + '.'; return; }
        if (this.grouping === 'month' && list.indexOf(this.period) === -1) this.period = list[0];
        this.snapPeriod(list);
        this.loading.report = true; this.reportError = '';
        try { this.report = await gas('getPeriodReport', this.property, this.period, this.grouping); this.noteDraft = this.report.note || ''; }
        catch (err) { this.report = null; this.reportError = err.message; }
        this.loading.report = false;
      },
      async loadTrends() {
        if (!this.period) return;
        this.loading.trends = true;
        try { this.trends = await gas('getTrends', this.trendProperty, [this.trendKey].concat(MATRIX_KEYS), this.period, 24); }
        catch (err) { this.toast(err.message, 'error'); }
        this.loading.trends = false;
      },
      printPage() { window.print(); },

      /* ---------- report actions ---------- */
      async saveNote() {
        try { await gas('saveNote', this.report.property, this.report.period, this.noteDraft); this.report.note = this.noteDraft; this.toast('Note saved.', 'success'); }
        catch (err) { this.toast(err.message, 'error'); }
      },
      async toggleTiming(f) {
        try { await gas('saveTag', this.report.property, this.report.period, f.key, !f.tagged, ''); this.toast(f.tagged ? 'Tag removed.' : 'Tagged as timing.', 'success'); this.loadReport(); }
        catch (err) { this.toast(err.message, 'error'); }
      },

      /* ---------- P&L upload ---------- */
      onPnlFile(e) {
        const f = e.target.files[0]; if (!f) return;
        const reader = new FileReader();
        reader.onload = ev => { e.target.value = ''; this.pnl.fileName = f.name; this.pnl.text = ev.target.result; this.previewPnl(); };
        reader.readAsText(f);
      },
      async previewPnl() {
        this.pnl.stage = 'reading'; this.pnl.error = ''; this.pnl.preview = null;
        try { this.pnl.preview = await gas('previewPnlUpload', this.pnl.text, this.pnl.fileName, this.pnl.asOf); this.pnl.stage = 'preview'; }
        catch (err) { this.pnl.stage = 'error'; this.pnl.error = err.message; }
      },
      async commitPnl() {
        this.pnl.stage = 'saving';
        try {
          const res = await gas('commitPnlUpload', this.pnl.text, this.pnl.fileName, this.pnl.asOf);
          this.toast('Saved ' + res.months + ' month × property combinations.', 'success');
          this.resetPnl();
          await this.loadBoot(false);
          if (res.latest) this.period = res.latest;
        } catch (err) { this.pnl.stage = 'error'; this.pnl.error = err.message; }
      },
      resetPnl() { this.pnl = { stage: null, fileName: '', text: null, asOf: this.pnl.asOf, preview: null, error: '' }; },

      /* ---------- budget upload ---------- */
      onBudgetFile(e) {
        const f = e.target.files[0]; if (!f) return;
        const reader = new FileReader();
        reader.onload = ev => { e.target.value = ''; this.budget.fileName = f.name; this.budget.base64 = String(ev.target.result).split(',')[1]; this.previewBudget(); };
        reader.readAsDataURL(f);
      },
      async previewBudget() {
        this.budget.stage = 'reading'; this.budget.error = ''; this.budget.preview = null;
        const req = this.budget.mode === 'sheet' ? { sheetId: this.budget.sheetId } : { base64: this.budget.base64, fileName: this.budget.fileName };
        try {
          const p = await gas('previewBudgetUpload', req);
          this.budget.preview = p; this.budget.year = p.year; this.budget.property = p.suggestedProperty || ''; this.budget.stage = 'preview';
        } catch (err) { this.budget.stage = 'error'; this.budget.error = err.message; }
      },
      async commitBudget() {
        this.budget.stage = 'saving';
        try {
          const res = await gas('commitBudgetUpload', this.budget.preview.token, this.budget.property, this.budget.year);
          this.toast('Saved the ' + res.year + ' budget for ' + this.propertyName(res.property) + (res.status === 'draft' ? ' as a draft' : '') + '.', 'success');
          this.resetBudget(); await this.loadBoot(false);
          this.openReview(res.property, res.year);
        } catch (err) { this.budget.stage = 'error'; this.budget.error = err.message; }
      },
      resetBudget() { this.budget = { stage: null, mode: this.budget.mode, fileName: '', base64: null, sheetId: '', year: null, property: '', preview: null, error: '' }; },

      async removeMonth(code, period) {
        if (!confirm('Remove ' + this.monthLabel(period) + ' for ' + this.propertyName(code) + '? It can be uploaded again later.')) return;
        try { await gas('removeMonth', code, period); this.toast('Removed.', 'success'); await this.loadBoot(false); }
        catch (err) { this.toast(err.message, 'error'); }
      },
      async removeBudget(code, year) {
        if (!confirm('Remove the ' + year + ' budget for ' + this.propertyName(code) + '?')) return;
        try { await gas('removeBudget', code, year); this.toast('Budget removed.', 'success'); await this.loadBoot(false); }
        catch (err) { this.toast(err.message, 'error'); }
      },

      /* ---------- settings ---------- */
      async openSettings() {
        this.settings = { open: true, draft: null, error: '', newViewer: '', newAdmin: '', globalAdmins: null, minPctWhole: 10 };
        try {
          const s = await gas('getSettings');
          this.settings.draft = s; this.settings.minPctWhole = Math.round(s.rules.minPct * 100);
          try { this.settings.globalAdmins = await gas('getGlobalAdmins'); } catch (e) { this.settings.globalAdmins = null; }
        } catch (err) { this.settings.error = err.message; }
      },
      addViewer() {
        const e = this.settings.newViewer.trim();
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e)) { this.settings.error = 'Enter a valid email address.'; return; }
        if (!this.settings.draft.viewers.some(x => x.toLowerCase() === e.toLowerCase())) this.settings.draft.viewers.push(e);
        this.settings.newViewer = ''; this.settings.error = '';
      },
      async saveSettings() {
        const payload = JSON.parse(JSON.stringify(this.settings.draft));
        payload.rules.minPct = (Number(this.settings.minPctWhole) || 0) / 100;
        try { await gas('saveSettings', payload); this.settings.open = false; this.toast('Settings saved.', 'success'); await this.loadBoot(false); this.go(this.view); }
        catch (err) { this.settings.error = err.message; }
      },
      addGlobalAdmin() {
        const e = this.settings.newAdmin.trim();
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e)) { this.settings.error = 'Enter a valid email address.'; return; }
        if (!this.settings.globalAdmins.some(x => x.toLowerCase() === e.toLowerCase())) this.settings.globalAdmins.push(e);
        this.settings.newAdmin = '';
      },
      removeGlobalAdmin(e) {
        if (this.settings.globalAdmins.length <= 1) { this.settings.error = 'At least one global admin is required.'; return; }
        this.settings.globalAdmins = this.settings.globalAdmins.filter(x => x !== e);
      },
      async saveGlobalAdmins() {
        try { this.settings.globalAdmins = await gas('saveGlobalAdmins', this.settings.globalAdmins); this.toast('Global admins saved.', 'success'); }
        catch (err) { this.settings.error = err.message; }
      }
    }
  }).mount('#app');
</script>
</body>
</html>
