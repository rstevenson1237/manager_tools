<!-- ============================== INVENTORY (included by Index.html) ============================== -->
<template v-if="view === 'inventory'">
  <div class="row no-print">
    <div class="subtabs" role="tablist" aria-label="Inventory">
      <button v-for="s in invSubViews" :key="s.key" role="tab" :aria-selected="inv.sub === s.key" :class="['subtab', { active: inv.sub === s.key }]" @click="invGo(s.key)">{{ s.label }}</button>
    </div>
  </div>

  <!-- ------------------------------ DASHBOARD ------------------------------ -->
  <template v-if="inv.sub === 'dashboard'">
    <div class="row">
      <div>
        <div class="muted">The regional check of each property's count: what is still worth asking the store about</div>
        <h1>Inventory check<template v-if="invLatest.period"> · {{ monthLabel(invLatest.period) }}</template></h1>
      </div>
      <div class="controls no-print">
        <button v-if="invCanEdit" @click="invGo('upload')">Upload counts</button>
        <button class="ghost" @click="loadInvDash" :disabled="inv.dashLoading">Refresh</button>
      </div>
    </div>
    <div v-if="inv.dashLoading && !inv.dash" class="muted"><span class="spin"></span>Loading…</div>
    <div v-else-if="inv.dashError" class="banner warn">{{ inv.dashError }}</div>
    <template v-if="inv.dash">
      <div v-if="!invMonths.length" class="card empty">
        No inventory counts checked yet.
        <template v-if="invCanEdit"><br><br>Once a store has finished its review in Inventory Audit, export the same <b>Inventory Count Item Details</b> from R365 and <button class="link" @click="invGo('upload')">upload it</button>.</template>
      </div>
      <template v-else>
        <div class="grid">
          <div class="card stat"><div class="label">Properties checked</div><div class="value">{{ invLatest.rows.length }}</div>
            <div class="sub">for {{ monthLabel(invLatest.period) }}</div></div>
          <div class="card stat"><div class="label">Clean</div><div class="value">{{ invLatest.clean }}</div>
            <div class="sub">no item of ${{ money(inv.dash.highImpact) }} or more</div></div>
          <div class="card stat"><div class="label">High-impact items</div><div class="value" :class="{ bad: invLatest.high }">{{ invLatest.high }}</div>
            <div class="sub">questions for the stores</div></div>
          <div class="card stat"><div class="label">Their dollar impact</div><div class="value">${{ money(invLatest.highValue) }}</div>
            <div class="sub">fewer than 10 items each once audited</div></div>
        </div>

        <div class="card flush">
          <div class="head"><h2>Checks on file</h2><span class="muted">One row per property and month · select a row for its report</span></div>
          <div class="scroll">
            <table style="min-width:900px">
              <thead><tr><th>Property · month</th><th style="text-align:left">Counts</th><th>Value</th><th>Change</th><th>Picked</th><th>High impact</th><th style="text-align:left">Status</th><th class="no-print"></th></tr></thead>
              <tbody>
                <tr v-for="m in invMonths" :key="m.key" class="clickable" @click="openInvReport(m.property, m.period)">
                  <td><b>{{ propertyName(m.property) }}</b> <span class="muted">{{ monthLabel(m.period) }}</span></td>
                  <td style="text-align:left">{{ m.counts.map(c => c.label).join(', ') }}
                    <div class="muted">uploaded {{ dayLabel(m.counts[0].uploadedAt) }}<template v-if="m.counts[0].uploadedBy"> by {{ m.counts[0].uploadedBy }}</template></div></td>
                  <td>{{ money(m.value) }}</td>
                  <td :class="cls(m.value - m.prev)">{{ signed(m.value - m.prev) }}</td>
                  <td class="muted">{{ m.picked }}</td>
                  <td><b v-if="m.high" class="bad">{{ m.high }}</b><span v-else class="muted">0</span>
                    <div class="muted" v-if="m.high">${{ money(m.highValue) }}</div></td>
                  <td style="text-align:left">
                    <span v-if="m.tieOuts" class="badge preliminary">Export does not add up</span>
                    <span v-else-if="m.high" class="badge preliminary">{{ m.high }} question{{ m.high === 1 ? '' : 's' }}</span>
                    <span v-else class="badge settled">Clean</span></td>
                  <td class="no-print" @click.stop>
                    <template v-if="inv.dash.isAdmin"><button v-for="c in m.counts" :key="c.id" class="link small" style="margin-left:6px" @click="removeInvCount(c)" :title="'Remove the ' + c.label + ' check'" :aria-label="'Remove the ' + c.label + ' check'">× {{ m.counts.length > 1 ? c.label : '' }}</button></template></td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </template>
    </template>
  </template>

  <!-- ------------------------------ UPLOAD ------------------------------ -->
  <template v-if="inv.sub === 'upload'">
    <div class="row"><h1>Upload counts</h1></div>
    <div v-if="!invCanEdit" class="banner warn">Only an administrator or an inventory reviewer can upload counts.</div>
    <div v-else class="card" style="display:flex;flex-direction:column;gap:12px">
      <p class="muted" style="margin:0">Once a store has finished its review in Inventory Audit, export the same <b>Inventory Count Item Details</b> from R365 as CSV and upload it here.
        Choose several files at once, one per property and count. Each file is checked on its own; only its totals and the items the rules pick are kept.
        Uploading the same property, count name and month again replaces that check.</p>
      <div class="controls">
        <div class="field"><label for="inv-period">Month the counts close</label><input id="inv-period" type="month" v-model="inv.up.period" @change="invRepreviewAll" placeholder="YYYY-MM"></div>
        <label class="drop" for="inv-files" style="flex:1;min-width:260px;padding:14px">
          <b>Choose CSV files</b><br><span class="muted">one per property and count</span>
          <input id="inv-files" type="file" accept=".csv" multiple @change="onInvFiles">
        </label>
      </div>
      <div class="card flush" v-if="inv.up.files.length">
        <div class="scroll">
          <table style="min-width:900px" class="inv-up">
            <thead><tr><th>File</th><th style="text-align:left">Property</th><th style="text-align:left">Count name</th><th style="text-align:left;width:45%">What the check found</th><th></th></tr></thead>
            <tbody>
              <tr v-for="f in inv.up.files" :key="f.id">
                <td style="white-space:normal;max-width:200px"><b>{{ f.fileName }}</b></td>
                <td style="text-align:left">
                  <select v-model="f.property" @change="previewInvFile(f)" :disabled="f.stage === 'saving' || f.stage === 'saved'" :aria-label="'Property for ' + f.fileName">
                    <option value="" disabled>Choose…</option>
                    <option v-for="p in invProperties" :key="p.code" :value="p.code">{{ p.name }}</option>
                  </select></td>
                <td style="text-align:left">
                  <input type="text" v-model="f.label" list="inv-labels" @input="invRepreviewSoon(f)" :disabled="f.stage === 'saving' || f.stage === 'saved'" style="width:130px" :aria-label="'Count name for ' + f.fileName"></td>
                <td style="text-align:left;white-space:normal">
                  <span v-if="f.stage === 'reading'" class="muted"><span class="spin"></span>Checking…</span>
                  <span v-else-if="f.stage === 'saving'" class="muted"><span class="spin"></span>Saving…</span>
                  <span v-else-if="f.stage === 'error'" class="bad">{{ f.error }}</span>
                  <template v-else-if="f.preview">
                    <div><b :class="f.preview.highImpact ? 'bad' : 'good'">{{ f.preview.highImpact ? f.preview.highImpact + ' high-impact item' + (f.preview.highImpact === 1 ? '' : 's') + ' ($' + money(f.preview.highImpactValue) + ')' : 'Clean: nothing of $' + money(inv.dash ? inv.dash.highImpact : 1000) + ' or more' }}</b>
                      <span class="muted"> · {{ f.preview.rows }} items · value {{ money(f.preview.totals.current) }} ({{ signed(f.preview.totals.change) }})</span></div>
                    <div v-for="t in f.preview.top.slice(0, 3)" :key="t.item" class="muted">{{ t.item }}: ${{ money(t.impact) }}</div>
                    <div v-if="f.preview.tieOuts" class="bad">{{ f.preview.tieOuts }} items do not add up. Check the export.</div>
                    <div v-if="f.preview.follows.status === 'differs'" class="bad">Does not follow {{ monthLabel(f.preview.follows.period) }}'s count on file: its previous total is {{ money(f.preview.follows.found) }}, {{ monthLabel(f.preview.follows.period, true) }} was {{ money(f.preview.follows.expected) }}. Check the month and the property.</div>
                    <div v-else class="muted">{{ invFollowsText(f.preview.follows) }}</div>
                    <div v-if="f.preview.existing" class="muted">Replaces the check uploaded {{ dayLabel(f.preview.existing.uploadedAt) }} ({{ f.preview.existing.highImpact }} high impact then).</div>
                    <div v-if="f.preview.duplicateOf" class="bad">Identical to the {{ f.preview.duplicateOf.label }} count on file for {{ propertyName(f.preview.duplicateOf.property) }}, {{ monthLabel(f.preview.duplicateOf.period) }}: not saved.</div>
                    <div v-if="f.preview.suggestedLabel.toLowerCase() !== f.preview.target.label.toLowerCase()" class="muted">Reads as a {{ f.preview.suggestedLabel }} count.</div>
                    <div v-if="f.stage === 'saved'"><b class="good">✓ Saved.</b> <button class="link small" @click="openInvReport(f.result.property, f.result.period)">Open the report</button></div>
                  </template></td>
                <td><button v-if="f.stage !== 'saving'" class="link small" @click="invDropFile(f)" :aria-label="'Drop ' + f.fileName">×</button></td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
      <datalist id="inv-labels"><option v-for="l in invLabelChoices" :key="l" :value="l"></option></datalist>
      <div class="controls" v-if="inv.up.files.length">
        <button @click="commitInvAll" :disabled="inv.up.saving || !invUpReady.length">{{ inv.up.saving ? 'Saving…' : 'Save ' + invUpReady.length + ' check' + (invUpReady.length === 1 ? '' : 's') }}</button>
        <button class="ghost" @click="invClearSaved" :disabled="inv.up.saving">Clear saved files</button>
      </div>
    </div>
  </template>

  <!-- ------------------------------ REPORT ------------------------------ -->
  <template v-if="inv.sub === 'report'">
    <div v-if="!invReportOptions.length && inv.dash" class="card empty">No inventory checks on file.</div>
    <template v-else>
      <div class="row no-print">
        <div class="controls">
          <div class="field"><label for="inv-rep">Property · month</label>
            <select id="inv-rep" v-model="inv.repKey" @change="loadInvReport">
              <option v-for="o in invReportOptions" :key="o.key" :value="o.key">{{ propertyName(o.property) }} · {{ monthLabel(o.period) }}</option>
            </select></div>
        </div>
        <div class="controls">
          <button v-if="invRep" @click="invCopy">Copy the questions</button>
          <button class="ghost" @click="printPage" :disabled="!invRep">Print / save as PDF</button>
        </div>
      </div>
      <div v-if="inv.repLoading" class="muted"><span class="spin"></span>Loading…</div>
      <div v-else-if="inv.repError" class="banner warn">{{ inv.repError }}</div>
      <template v-if="invRep && !inv.repLoading">
        <div>
          <div class="muted"><template v-for="(c, i) in invRep.counts" :key="c.id">{{ i ? ' + ' : '' }}{{ c.label }} (uploaded {{ dayLabel(c.uploadedAt) }}<template v-if="c.uploadedBy"> by {{ c.uploadedBy }}</template>)</template></div>
          <h1>{{ propertyName(invRep.property) }} · {{ monthLabel(invRep.period) }} inventory
            <span v-if="invRep.status === 'clean'" class="badge settled">Clean</span>
            <span v-else class="badge preliminary">{{ invRep.questions.length }} question{{ invRep.questions.length === 1 ? '' : 's' }}</span></h1>
        </div>
        <div class="banner warn" v-for="x in invRep.issues" :key="x">{{ x }}</div>
        <div v-if="inv.copyText" class="card no-print">
          <label for="inv-copy" class="muted">The questions as text: copy them into an email to the store manager</label>
          <textarea id="inv-copy" readonly :value="inv.copyText" style="min-height:160px;font-size:12px"></textarea>
        </div>

        <div class="row" style="align-items:stretch">
          <div class="hero" style="flex:1 1 340px">
            <div class="label">Inventory value</div>
            <div><span class="value">${{ money(invRep.headline.value) }}</span> <span style="color:#C9CED6">{{ invRep.counts.length }} count{{ invRep.counts.length === 1 ? '' : 's' }}</span></div>
            <div style="display:flex;flex-wrap:wrap;gap:6px 18px">
              <span>Last count {{ money(invRep.headline.prevValue) }} · <b :class="invRep.headline.change >= 0 ? 'good' : 'bad'">{{ signed(invRep.headline.change) }}</b><template v-if="invRep.headline.changePct != null"> ({{ signedPct(invRep.headline.changePct) }})</template></span>
              <span>Price changes {{ signed(invRep.headline.priceEffect) }} · quantities {{ signed(invRep.headline.qtyEffect) }}</span>
            </div>
            <div class="warn" v-if="invRep.questions.length">{{ invRep.questions.length }} item{{ invRep.questions.length === 1 ? '' : 's' }} of ${{ money(invRep.highImpact) }} or more to ask the store about.</div>
          </div>
          <div class="grid" style="flex:999 1 560px">
            <div class="card stat" v-for="k in invRep.kpis" :key="k.key">
              <div class="label">{{ k.label }}</div>
              <div class="value" :class="{ bad: k.bad }">{{ invKpi(k) }}</div>
              <div class="sub">{{ k.sub }}</div>
            </div>
          </div>
        </div>

        <div class="card">
          <div class="row" style="margin-bottom:12px">
            <h2>Questions for the store · {{ invRep.questions.length }}</h2>
            <span class="muted">Items still worth ${{ money(invRep.highImpact) }} or more after the store's review, largest dollar impact first</span>
          </div>
          <p v-if="!invRep.questions.length" class="muted">Nothing of ${{ money(invRep.highImpact) }} or more. The count looks properly audited.</p>
          <div class="grid wide">
            <div v-for="q in invRep.questions" :key="q.countId + q.key" class="flag-card act-adjust">
              <div class="row" style="align-items:baseline">
                <b>{{ q.item }}</b>
                <span class="bad" style="font-weight:700">${{ money(q.impact) }}</span>
              </div>
              <div class="muted">{{ q.uom }} · {{ q.inventoryAcct }}<template v-if="invRep.counts.length > 1"> · {{ q.countLabel }}</template></div>
              <div v-for="(why, i) in q.reasons" :key="i" class="driver"><span>{{ why }}</span></div>
              <div v-if="q.history" class="driver"><span><b>{{ q.history }}</b></span></div>
              <div class="muted">Qty {{ qty(q.prevQty) }} → {{ qty(q.curQty) }} · cost {{ cost(q.prevCost) }} → {{ cost(q.curCost) }} · value {{ money(q.curTotal) }}
                <template v-if="Math.round(q.priceEffect)"> · price {{ signed(q.priceEffect) }}</template><template v-if="Math.round(q.qtyEffect)"> · qty {{ signed(q.qtyEffect) }}</template></div>
            </div>
          </div>
        </div>

        <div class="card flush" v-if="invRep.others.length">
          <div class="head"><h2>Smaller items the rules picked · {{ invRep.others.length }}</h2>
            <button class="link no-print" @click="inv.showOthers = !inv.showOthers">{{ inv.showOthers ? 'Hide' : 'Show' }}</button></div>
          <div class="scroll" v-if="inv.showOthers">
            <table style="min-width:760px">
              <thead><tr><th>Item</th><th>Dollar impact</th><th style="text-align:left;width:60%">Why</th></tr></thead>
              <tbody>
                <tr v-for="q in invRep.others" :key="q.countId + q.key">
                  <td style="white-space:normal"><b>{{ q.item }}</b><div class="muted">{{ q.uom }}<template v-if="invRep.counts.length > 1"> · {{ q.countLabel }}</template></div></td>
                  <td>{{ money(q.impact) }}</td>
                  <td style="text-align:left;white-space:normal">{{ q.reasons[0] }}<div v-if="q.history" class="muted">{{ q.history }}</div></td>
                </tr>
              </tbody>
            </table>
          </div>
          <div class="muted" style="padding:10px 16px">The store team reviewed these in Inventory Audit; under ${{ money(invRep.highImpact) }} each.</div>
        </div>

        <div class="card flush">
          <div class="head"><h2>Inventory by account</h2>
            <span class="muted">Change splits into price (cost changes on what was counted) and quantity (everything else)</span></div>
          <div class="pl-scroll">
            <table :style="{ minWidth: (lineColWidth + 8 * 100) + 'px' }">
              <thead><tr>
                <th class="line-col" :style="lineColStyle">Account
                  <span class="col-resize no-print" :class="{ dragging: resizing }" role="separator" aria-orientation="vertical" tabindex="0"
                    :aria-valuenow="lineColWidth" :aria-valuemin="LINE_COL_MIN" :aria-valuemax="LINE_COL_MAX" aria-label="Resize the account column"
                    title="Drag to resize · double-click to reset" @pointerdown="startResize" @dblclick="resetLineCol" @keydown="keyResize"></span></th>
                <th>Value</th><th>Last count</th><th>Change</th><th>Change %</th><th>Price</th><th>Quantity</th><th>Items</th><th>Picked</th><th>High impact</th></tr></thead>
              <tbody>
                <template v-for="a in invRep.accounts" :key="a.name">
                  <tr class="sec"><td colspan="10"><span class="sec-label">{{ a.name }}</span></td></tr>
                  <tr v-for="l in a.lines" :key="a.name + l.name">
                    <td class="line-col indent" :style="lineColStyle">{{ l.name }}</td>
                    <td>{{ money(l.value) }}</td><td class="muted">{{ money(l.prev) }}</td>
                    <td :class="cls(l.change)">{{ signed(l.change) }}</td>
                    <td :class="cls(l.change)">{{ l.changePct == null ? '—' : signedPct(l.changePct) }}</td>
                    <td :class="cls(l.priceEffect)">{{ signed(l.priceEffect) }}</td>
                    <td :class="cls(l.qtyEffect)">{{ signed(l.qtyEffect) }}</td>
                    <td class="muted">{{ l.items }}</td><td class="muted">{{ l.flagged }}</td><td :class="{ bad: l.highImpact }">{{ l.highImpact || '' }}</td>
                  </tr>
                  <tr class="total" v-if="a.lines.length > 1">
                    <td class="line-col" :style="lineColStyle">Total {{ a.name }}</td>
                    <td>{{ money(a.value) }}</td><td class="muted">{{ money(a.prev) }}</td>
                    <td :class="cls(a.change)">{{ signed(a.change) }}</td>
                    <td :class="cls(a.change)">{{ a.changePct == null ? '—' : signedPct(a.changePct) }}</td>
                    <td :class="cls(a.priceEffect)">{{ signed(a.priceEffect) }}</td>
                    <td :class="cls(a.qtyEffect)">{{ signed(a.qtyEffect) }}</td>
                    <td class="muted">{{ a.items }}</td><td class="muted">{{ a.flagged }}</td><td :class="{ bad: a.highImpact }">{{ a.highImpact || '' }}</td>
                  </tr>
                </template>
                <tr class="key">
                  <td class="line-col" :style="lineColStyle">Total inventory</td>
                  <td>{{ money(invRep.headline.value) }}</td><td>{{ money(invRep.headline.prevValue) }}</td>
                  <td>{{ signed(invRep.headline.change) }}</td><td>{{ invRep.headline.changePct == null ? '—' : signedPct(invRep.headline.changePct) }}</td>
                  <td>{{ signed(invRep.headline.priceEffect) }}</td><td>{{ signed(invRep.headline.qtyEffect) }}</td>
                  <td>{{ invRep.accounts.reduce((s, a) => s + a.items, 0) }}</td><td>{{ invRep.questions.length + invRep.others.length }}</td><td>{{ invRep.questions.length || '' }}</td>
                </tr>
              </tbody>
            </table>
          </div>
          <div class="muted" style="padding:10px 16px">Blue = value went up, orange = down. Accounts are company-wide: a bar's cocktail ingredients can sit in a food account. Item counts include anything stocked in either count.</div>
        </div>

        <div class="card flush" v-if="invRep.pnl">
          <div class="head"><h2>Against the P&amp;L</h2><span class="muted">{{ monthLabel(invRep.period) }} cost of sales<template v-if="invRep.pnl.stage === 'mtd'">, month to date through {{ dayLabel(invRep.pnl.asOf) }}</template></span></div>
          <div class="scroll">
            <table>
              <thead><tr><th>Line</th><th>Inventory</th><th>Cost of sales</th><th>Days on hand</th><th>Change as % of cost</th></tr></thead>
              <tbody>
                <tr v-for="p in invRep.pnl.rows" :key="p.key">
                  <td>{{ p.key }} {{ p.name }}</td><td>{{ money(p.inventory) }}</td><td class="muted">{{ p.cost == null ? 'not posted' : money(p.cost) }}</td>
                  <td><b>{{ p.days == null ? '—' : Math.round(p.days) }}</b></td>
                  <td :class="p.changeShare != null && Math.abs(p.changeShare) >= 10 ? 'bad' : 'muted'">{{ p.changeShare == null ? '—' : signedPct(p.changeShare) }}</td>
                </tr>
                <tr class="total" v-if="invRep.pnl.total && invRep.pnl.rows.length > 1"><td>Total</td><td>{{ money(invRep.pnl.total.inventory) }}</td><td>{{ money(invRep.pnl.total.cost) }}</td>
                  <td><b>{{ Math.round(invRep.pnl.total.days) }}</b></td><td>{{ signedPct(invRep.pnl.total.changeShare) }}</td></tr>
              </tbody>
            </table>
          </div>
          <div class="muted" style="padding:10px 16px">Days on hand = inventory ÷ the month's daily cost of sales. A drop in inventory is cost of sales bought in earlier months; a rise is purchases not yet used.
            A change of 10% or more of the month's cost moves the cost % noticeably. <template v-if="invRep.pnl.unmatched">Supplies and other accounts with no cost of sales line ({{ money(invRep.pnl.unmatched) }}) are left out.</template></div>
        </div>
        <div class="card flush" v-else-if="!boot.inventoryOnly">
          <div class="head"><h2>Against the P&amp;L</h2></div>
          <p class="muted" style="padding:0 16px">No P&amp;L for {{ monthLabel(invRep.period) }} is on file for this property yet. Upload it to see days on hand.</p>
        </div>

        <div class="muted">
          <span v-for="(c, i) in invRep.counts" :key="c.id">{{ i ? ' · ' : '' }}{{ c.label }}: {{ c.items }} items, {{ c.picked }} picked, {{ c.highImpact }} high impact · {{ invFollowsText(c.follows) }}<template v-if="c.file"> · {{ c.file }}</template></span></div>
      </template>
    </template>
  </template>
</template>
